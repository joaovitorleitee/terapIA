function NewSessionModal({ psicologoId, availability, blocks, sessions, patients, pricing, initialDate, initialTime, onClose, onCreate, onCreateMany }){
  const [patientIdSel, setPatientIdSel] = useState(patients[0]?.id || '');
  const [date, setDate] = useState(initialDate || todayStr());
  const [time, setTime] = useState(initialTime || '09:00');
  const [duration, setDuration] = useState(availability.defaultDurationMin);
  const [modalidade, setModalidade] = useState('Presencial');
  const [status, setStatus] = useState('confirmada');
  const [valor, setValor] = useState(() => getDefaultPrice(pricing, patients[0], 'Presencial'));
  const [valorTouched, setValorTouched] = useState(false);
  const [recurring, setRecurring] = useState(false);
  const [selectedDows, setSelectedDows] = useState(() => new Set([fromDateStr(initialDate || todayStr()).getDay()]));
  const [untilDate, setUntilDate] = useState(() => addDays(initialDate || todayStr(), 56));
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [summary, setSummary] = useState(null); // { created, skipped:[{date,reason}] } | null

  useEffect(() => {
    if(valorTouched) return;
    const patient = patients.find(p => p.id === patientIdSel);
    setValor(getDefaultPrice(pricing, patient, modalidade));
  }, [patientIdSel, modalidade, pricing, valorTouched, patients]);

  const toggleDow = (idx) => {
    setSelectedDows(prev => {
      const next = new Set(prev);
      next.has(idx) ? next.delete(idx) : next.add(idx);
      return next;
    });
  };

  const buildSession = (d) => ({
    id: sessionId(), psicologoId, patientId: patientIdSel, date: d, startTime: time,
    durationMin: Number(duration)||0, modalidade, status, valor: Number(valor)||0, createdAt:new Date().toISOString(),
  });

  const submit = async () => {
    setError('');
    if(!patientIdSel){ setError('Selecione um paciente.'); return; }

    if(!recurring){
      const check = checkSlotAvailability({ availability, blocks, sessions, psicologoId, date, startTime:time, durationMin:Number(duration)||0 });
      if(!check.available){ setError(check.reason); return; }
      setBusy(true);
      try{
        await onCreate(buildSession(date));
        onClose();
      }catch(e){
        setError('Não foi possível criar a sessão agora.');
      }finally{
        setBusy(false);
      }
      return;
    }

    // Recorrência (US-030)
    if(selectedDows.size === 0){ setError('Selecione ao menos um dia da semana para repetir.'); return; }
    if(!untilDate || untilDate < date){ setError('Escolha uma data final igual ou depois da data inicial.'); return; }

    const candidates = [];
    let cursor = date, guard = 0;
    while(cursor <= untilDate && guard < 400){
      guard++;
      if(selectedDows.has(fromDateStr(cursor).getDay())) candidates.push(cursor);
      cursor = addDays(cursor, 1);
    }
    if(candidates.length === 0){ setError('Nenhuma data cai nos dias selecionados dentro desse período.'); return; }
    if(candidates.length > 60){ setError(`Isso geraria ${candidates.length} sessões — reduza o período (máximo 60 por vez).`); return; }

    setBusy(true);
    try{
      const toCreate = [];
      const skipped = [];
      let simSessions = sessions; // simula conflitos entre as próprias sessões da série
      for(const d of candidates){
        const check = checkSlotAvailability({ availability, blocks, sessions: simSessions, psicologoId, date:d, startTime:time, durationMin:Number(duration)||0 });
        if(check.available){
          const s = buildSession(d);
          toCreate.push(s);
          simSessions = [...simSessions, s];
        } else {
          skipped.push({ date:d, reason: check.reason });
        }
      }
      if(toCreate.length > 0) await onCreateMany(toCreate);
      setSummary({ created: toCreate.length, skipped });
    }catch(e){
      setError('Não foi possível criar as sessões agora.');
    }finally{
      setBusy(false);
    }
  };

  if(summary){
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-box" onClick={e=>e.stopPropagation()}>
          <div style={{textAlign:'center', padding:'8px 4px'}}>
            <div className="icon-wrap" style={{margin:'0 auto 16px auto'}}><IconCheckCircle size={26}/></div>
            <h3 style={{marginBottom:8}}>{summary.created} sessão(ões) criada(s)</h3>
            {summary.skipped.length > 0 ? (
              <div style={{textAlign:'left', marginTop:14}}>
                <div className="field hint" style={{marginBottom:8}}>{summary.skipped.length} data(s) pulada(s):</div>
                {summary.skipped.map((sk,i) => (
                  <div key={i} className="mini-session-row" style={{textAlign:'left'}}>
                    <span><strong>{formatDateOnly(sk.date)}</strong> — {sk.reason}</span>
                  </div>
                ))}
              </div>
            ) : (
              <p style={{fontSize:13, color:'var(--ink-muted)'}}>Todas as datas selecionadas foram criadas sem conflitos.</p>
            )}
            <button className="btn-primary" style={{marginTop:18}} onClick={onClose}>Concluir</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box form-modal" onClick={e=>e.stopPropagation()}>
        <h3>Nova sessão</h3>
        {error && <div className="alert alert-danger">{error}</div>}
        <div className="form-grid">
          <div className="field full">
            <label>Paciente</label>
            <select value={patientIdSel} onChange={e=>setPatientIdSel(e.target.value)}>
              <option value="">Selecione</option>
              {patients.map(p => <option key={p.id} value={p.id}>{p.socialName || p.name}</option>)}
            </select>
          </div>
          <div className="field">
            <label>{recurring ? 'A partir de' : 'Data'}</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
          <div className="field">
            <label>Horário</label>
            <input type="time" value={time} onChange={e=>setTime(e.target.value)} />
          </div>
          <div className="field">
            <label>Duração (min)</label>
            <input type="number" min="10" step="5" value={duration} onChange={e=>setDuration(e.target.value)} />
          </div>
          <div className="field">
            <label>Modalidade</label>
            <select value={modalidade} onChange={e=>setModalidade(e.target.value)}>
              <option value="Presencial">Presencial</option>
              <option value="Online">Online</option>
            </select>
          </div>
          <div className="field">
            <label>Status inicial</label>
            <select value={status} onChange={e=>setStatus(e.target.value)}>
              <option value="agendada">Agendada (reserva provisória)</option>
              <option value="confirmada">Confirmada</option>
            </select>
          </div>
          <div className="field">
            <label>Valor da sessão (R$)</label>
            <input type="number" min="0" step="10" value={valor} onChange={e=>{ setValor(e.target.value); setValorTouched(true); }} />
          </div>
        </div>
        <div className="field hint" style={{marginTop:-8, marginBottom:14}}>Preenchido automaticamente com base no preço configurado (padrão ou personalizado do paciente) — pode ser ajustado manualmente.</div>

        <label className="checkbox-row">
          <input type="checkbox" checked={recurring} onChange={e=>setRecurring(e.target.checked)} />
          <span>Repetir esta sessão semanalmente em um ou mais dias</span>
        </label>

        {recurring && (
          <div style={{marginBottom:6}}>
            <div className="field hint" style={{marginBottom:8}}>Repetir nos dias</div>
            <div style={{display:'flex', gap:6, flexWrap:'wrap', marginBottom:14}}>
              {WEEKDAYS.map((d,idx) => (
                <button key={d.key} type="button"
                        className={'filter-pill '+(selectedDows.has(idx)?'active':'')}
                        onClick={()=>toggleDow(idx)}>{d.label.slice(0,3)}</button>
              ))}
            </div>
            <div className="field">
              <label>Repetir até</label>
              <input type="date" value={untilDate} onChange={e=>setUntilDate(e.target.value)} />
            </div>
            <div className="field hint" style={{marginTop:6}}>Datas bloqueadas, fora do expediente ou em conflito são puladas automaticamente — você verá a lista ao final.</div>
          </div>
        )}

        {patients.length === 0 && (
          <div className="alert alert-danger">Cadastre um paciente ativo antes de criar sessões (US-003).</div>
        )}
        <div className="modal-actions">
          <button className="btn-secondary" type="button" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" type="button" onClick={submit} disabled={busy || patients.length===0}>
            {busy && <span className="spinner"/>}
            {busy ? 'Criando…' : (recurring ? 'Criar sessões' : 'Criar sessão')}
          </button>
        </div>
      </div>
    </div>
  );
}

  const isTerminal = session.status === 'reagendada';
  return (
    <div className="modal-overlay" onClick={onClose} style={{background:'transparent'}}>
      <div className="session-popover" style={{position:'relative', margin:'auto'}} onClick={e=>e.stopPropagation()}>
        <div className="sp-name">{patient ? (patient.socialName || patient.name) : 'Paciente removido'}</div>
        <div className="sp-meta">{formatDateOnly(session.date)} às {session.startTime} · {session.durationMin} min · {session.modalidade || 'Presencial'}</div>
        <div className="sp-meta" style={{marginTop:-6}}>Valor: {formatCurrency(session.valor)}</div>
        <span className={'badge status-'+session.status} style={{marginBottom:10, marginTop:6, display:'inline-block'}}>

        )}

          <div className="alert alert-danger" style={{marginBottom:10, fontSize:11.5}}>Horário ainda ocupado — aguardando liberação manual.</div>
        )}
        {session.status === 'realizada' && (
          <div className="field hint" style={{marginBottom:10}}>Pronta para gerar cobrança e nota fiscal quando o Financeiro (US-014/015) estiver disponível.</div>
        )}
        <div className="sp-actions">
          {session.status === 'agendada' && (
            <button className="sp-action" onClick={()=>onStatusChange({ status:'confirmada' })}>Confirmar sessão</button>
          )}
          {session.status === 'pendente' && (
            <React.Fragment>
              <button className="sp-action" onClick={()=>onStatusChange({ status:'confirmada' })}>Aprovar agendamento</button>
              <button className="sp-action danger" onClick={()=>onStatusChange({ status:'cancelada', cancelledAt:new Date().toISOString(), cancelledBy:'psicologo', pendingRelease:false })}>Recusar</button>
            </React.Fragment>
          )}
          {session.status === 'cancelada' && session.pendingRelease && (
            <button className="sp-action" onClick={()=>onStatusChange({ pendingRelease:false })}>Liberar horário na agenda</button>
          )}
          {(session.status === 'confirmada' || session.status === 'agendada') && (
            <button className="sp-action" onClick={()=>onStatusChange({ status:'realizada' })}>Marcar como realizada</button>
          )}
          {(session.status === 'confirmada' || session.status === 'agendada') && (
            <button className="sp-action danger" onClick={()=>onStatusChange({ status:'falta' })}>Marcar falta (não compareceu)</button>
          )}
          {session.status !== 'cancelada' && session.status !== 'pendente' && session.status !== 'reagendada' && (
            <button className="sp-action danger" onClick={()=>onStatusChange({ status:'cancelada', cancelledAt:new Date().toISOString(), cancelledBy:'psicologo', pendingRelease:false })}>Cancelar sessão</button>
          )}
          {session.status === 'cancelada' && !session.pendingRelease && (
            <button className="sp-action" onClick={()=>onStatusChange({ status:'confirmada' })}>Reconfirmar</button>
          )}
          {session.status === 'falta' && (
            <button className="sp-action" onClick={()=>onStatusChange({ status:'confirmada' })}>Reverter para confirmada</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------- Calendar: Day view ---------- */
function DayView({ date, ctx, filteredSessionIds, onSlotClick, onSessionClick }){
  const slots = generateSlots(7, 20, 30);
  return (
    <div className="cal-scroll">
      <div className="cal-day-list">
        {slots.map(time => {
          const status = computeSlotStatus(date, time, ctx);
          let content;
          if(status.kind === 'sessao'){
            const included = filteredSessionIds.has(status.session.id);
            const p = ctx.patients.find(pp => pp.id === status.session.patientId);
            content = included ? (
              <button className={'slot-chip status-'+status.session.status} onClick={()=>onSessionClick(status.session)}>
                <span className="dot"/> {p ? (p.socialName||p.name) : 'Paciente'}
              </button>
            ) : <div className="slot-chip status-filtrada">Sessão (fora do filtro)</div>;
          } else if(status.kind === 'bloqueado'){
            content = <span style={{fontSize:11, color:'var(--ink-faint)'}}>Bloqueado{status.label?': '+status.label:''}</span>;
          } else if(status.kind === 'fora'){
            content = null;
          } else {
            content = null;
          }
          const cellClass = status.kind==='livre' ? 'slot-livre' : status.kind==='bloqueado' ? 'slot-bloqueado' : status.kind==='fora' ? 'slot-fora' : '';
          return (
            <div className="cal-row" key={time}>
              <div className="cal-time">{time.endsWith(':00') ? time : ''}</div>
              <div className={'cal-cell '+cellClass} onClick={()=> status.kind==='livre' && onSlotClick(date, time)}>
                {content}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Calendar: Week view ---------- */
function WeekView({ weekStart, ctx, filteredSessionIds, onSlotClick, onSessionClick }){
  const slots = generateSlots(7, 20, 60);
  const days = Array.from({length:7}, (_,i) => addDays(weekStart, i));
  return (
    <div className="cal-scroll">
      <div className="cal-week-head">
        <div/>
        {days.map(d => (
          <div className="whd" key={d}>{DOW_SHORT[fromDateStr(d).getDay()]}<br/>{fromDateStr(d).getDate()}</div>
        ))}
      </div>
      <div className="cal-week-grid">
        {slots.map(time => (
          <React.Fragment key={time}>
            <div className="cal-time cal-week-row-time">{time}</div>
            {days.map(d => {
              const status = computeSlotStatus(d, time, ctx);
              let inner = null;
              if(status.kind === 'sessao' && filteredSessionIds.has(status.session.id)){
                const p = ctx.patients.find(pp => pp.id === status.session.patientId);
                inner = (
                  <button className={'slot-chip status-'+status.session.status} style={{fontSize:10}} onClick={()=>onSessionClick(status.session)}>
                    <span className="dot"/> {(p ? (p.socialName||p.name) : 'Paciente').split(' ')[0]}
                  </button>
                );
              } else if(status.kind === 'sessao'){
                inner = <div className="slot-chip status-filtrada" style={{fontSize:10}}>—</div>;
              }
              const cellClass = status.kind==='livre' ? 'slot-livre' : status.kind==='bloqueado' ? 'slot-bloqueado' : status.kind==='fora' ? 'slot-fora' : '';
              return (
                <div className={'cal-week-cell '+cellClass} key={d+time}
                     onClick={()=> status.kind==='livre' && onSlotClick(d, time)}>
                  {inner}
                </div>
              );
            })}

        ))}
      </div>
    </div>
  );
}

/* ---------- Calendar: Month view ---------- */
function MonthView({ monthDate, ctx, onDayClick }){
  const year = fromDateStr(monthDate).getFullYear(), month = fromDateStr(monthDate).getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = new Date(firstOfMonth); gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  const cells = Array.from({length:42}, (_,i) => { const d = new Date(gridStart); d.setDate(d.getDate()+i); return d; });
  const today = todayStr();

  return (
    <div className="cal-month-grid">
      {DOW_SHORT.map(d => <div className="cal-month-head" key={d}>{d}</div>)}
      {cells.map((d,i) => {
        const dateStr = toDateStr(d);
        const inMonth = d.getMonth() === month;
        const daySessions = ctx.sessions.filter(s => s.psicologoId === ctx.psicologoId && s.date === dateStr);
        const dayAvailable = ctx.availability.weeklyHours[weekdayKeyOf(dateStr)]?.enabled;
        return (
          <div key={i} className={'cal-month-cell '+(inMonth?'':'muted')+(dateStr===today?' today':'')} onClick={()=>onDayClick(dateStr)}>
            <div className="day-num">{d.getDate()}</div>
            {!dayAvailable && inMonth && <div style={{fontSize:9.5, color:'var(--ink-faint)'}}>Sem expediente</div>}
            <div className="m-dots">
              {daySessions.slice(0,6).map(s => (
                <span key={s.id} className="dot" style={{background:
                  (s.status==='cancelada' || s.status==='falta') ? 'var(--danger)'
                  : (s.status==='realizada' || s.status==='reagendada') ? 'var(--ink-faint)'
                  : s.status==='pendente' ? 'var(--warning)'
                  : s.status==='agendada' ? 'var(--accent)'
                  : 'var(--primary)'}} />
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

  const [modalidadeFilter, setModalidadeFilter] = useState('all');
  const [newSlotFor, setNewSlotFor] = useState(null); // { date, time } | null
  const [selectedSession, setSelectedSession] = useState(null);

  const ctx = { availability, blocks, sessions, patients, psicologoId };

  const filteredSessionIds = React.useMemo(() => {
    return new Set(sessions.filter(s => {
      if(s.psicologoId !== psicologoId) return false;
      if(patientFilter !== 'all' && s.patientId !== patientFilter) return false;
      if(statusFilter !== 'all' && s.status !== statusFilter) return false;
      if(modalidadeFilter !== 'all' && (s.modalidade||'Presencial') !== modalidadeFilter) return false;
      return true;
    }).map(s => s.id));
  }, [sessions, psicologoId, patientFilter, statusFilter, modalidadeFilter]);

  const navigate = (dir) => {
    if(view==='dia') setRefDate(addDays(refDate, dir));
    else if(view==='semana') setRefDate(addDays(refDate, dir*7));
    else { const d = fromDateStr(refDate); d.setMonth(d.getMonth()+dir); setRefDate(toDateStr(d)); }
  };

  const label = () => {
    if(view==='dia'){
      const d = fromDateStr(refDate);
      return `${DOW_SHORT[d.getDay()]}, ${d.getDate()} de ${MONTH_NAMES[d.getMonth()]}`;
    }
    if(view==='semana'){
      const start = startOfWeek(refDate), end = addDays(start,6);
      return `${fromDateStr(start).getDate()} — ${fromDateStr(end).getDate()} de ${MONTH_NAMES[fromDateStr(end).getMonth()]}`;
    }
    const d = fromDateStr(refDate);
    return `${MONTH_NAMES[d.getMonth()]} de ${d.getFullYear()}`;

  return (
    <div>
      <div className="cal-toolbar">
        <div className="cal-nav">
          <button onClick={()=>navigate(-1)}><IconChevronLeft size={16}/></button>
          <button className="today-btn" onClick={()=>setRefDate(todayStr())}>Hoje</button>
          <button onClick={()=>navigate(1)}><IconChevronRight size={16}/></button>
          <div className="cal-label">{label()}</div>
        </div>
        <div className="subtabs" style={{border:'none', marginBottom:0}}>
          <button className={view==='dia'?'active':''} onClick={()=>setView('dia')}>Dia</button>
          <button className={view==='semana'?'active':''} onClick={()=>setView('semana')}>Semana</button>
          <button className={view==='mes'?'active':''} onClick={()=>setView('mes')}>Mês</button>
        </div>
        <button className="btn-new" onClick={()=>setNewSlotFor({ date:refDate, time:'09:00' })}><IconPlus size={15}/> Nova sessão</button>
      </div>

      <div className="cal-filters" style={{marginBottom:16}}>
        <select value={patientFilter} onChange={e=>setPatientFilter(e.target.value)}>
          <option value="all">Todos os pacientes</option>
          {patients.map(p => <option key={p.id} value={p.id}>{p.socialName||p.name}</option>)}
        </select>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="all">Todos os status</option>
          <option value="agendada">Agendada</option>
          <option value="confirmada">Confirmada</option>
          <option value="pendente">Pendente</option>
          <option value="realizada">Realizada</option>
          <option value="falta">Falta</option>
          <option value="cancelada">Cancelada</option>
          <option value="reagendada">Reagendada</option>
        </select>
        <select value={modalidadeFilter} onChange={e=>setModalidadeFilter(e.target.value)}>
          <option value="all">Presencial e online</option>
          <option value="Presencial">Presencial</option>
          <option value="Online">Online</option>
        </select>
      </div>

      <div className="cal-legend">
        <div className="item"><span className="dot" style={{background:'var(--primary-soft)', border:'1px solid var(--primary)'}}/> Livre</div>
        <div className="item"><span className="dot" style={{background:'#E4E9E0'}}/> Bloqueado</div>
        <div className="item"><span className="dot" style={{background:'var(--accent)'}}/> Agendada</div>
        <div className="item"><span className="dot" style={{background:'var(--primary)'}}/> Confirmada</div>
        <div className="item"><span className="dot" style={{background:'var(--warning)'}}/> Pendente</div>
        <div className="item"><span className="dot" style={{background:'var(--ink-faint)'}}/> Realizada</div>
        <div className="item"><span className="dot" style={{background:'var(--danger)'}}/> Falta</div>
        <div className="item"><span className="dot" style={{background:'var(--danger)'}}/> Cancelada</div>
      </div>

      {view === 'dia' && (
        <DayView date={refDate} ctx={ctx} filteredSessionIds={filteredSessionIds}
                 onSlotClick={(d,t)=>setNewSlotFor({date:d, time:t})}
                 onSessionClick={setSelectedSession} />
      )}
      {view === 'semana' && (
        <WeekView weekStart={startOfWeek(refDate)} ctx={ctx} filteredSessionIds={filteredSessionIds}
                  onSlotClick={(d,t)=>setNewSlotFor({date:d, time:t})}
                  onSessionClick={setSelectedSession} />
      )}
      {view === 'mes' && (
        <MonthView monthDate={refDate} ctx={ctx} onDayClick={(d)=>{ setRefDate(d); setView('dia'); }} />
      )}

      {newSlotFor && (
        <NewSessionModal
          psicologoId={psicologoId} availability={availability} blocks={blocks} sessions={sessions} patients={patients} pricing={pricing}
          initialDate={newSlotFor.date} initialTime={newSlotFor.time}
          onClose={()=>setNewSlotFor(null)}
          onCreate={onCreateSession}
          onCreateMany={onCreateSessions}
        />
      )}
      {selectedSession && (
        <SessionPopover
          session={selectedSession}
          patient={patients.find(p => p.id === selectedSession.patientId)}
          onClose={()=>setSelectedSession(null)}
          onStatusChange={async (patch) => { await onUpdateSession(selectedSession.id, patch); setSelectedSession(null); }}
        />
      )}
    </div>
  );
}

function AgendaPsicologo({ psicologoId }){
  const [tab, setTab] = useState('calendario');
  const [availability, setAvailability] = useState(null);
  const [blocks, setBlocks] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [patients, setPatients] = useState([]);
  const [cancelPolicy, setCancelPolicy] = useState(null);
  const [pricing, setPricing] = useState(null);
  const [saveState, setSaveState] = useState('idle'); // idle | saving | saved

  const refresh = useCallback(async () => {
    const [a, b, s, p, c, pr] = await Promise.all([loadAvailability(psicologoId), loadBlocks(), loadSessions(), loadPatients(), loadCancelPolicy(psicologoId), loadPricing(psicologoId)]);
    setAvailability(a);
    setBlocks(b.filter(x => x.psicologoId === psicologoId));
    setSessions(s.filter(x => x.psicologoId === psicologoId));
    setPatients(p.filter(x => x.psicologoId === psicologoId && x.status === 'ativo'));
    setCancelPolicy(c);
    setPricing(pr);
  }, [psicologoId]);

  useEffect(() => { refresh(); }, [refresh]);

  const persistAvailability = async (next) => {
    setAvailability(next);
    setSaveState('saving');
    await saveAvailability(psicologoId, next);
    setSaveState('saved');
    setTimeout(()=>setSaveState('idle'), 1500);
  };

  const persistCancelPolicy = async (next) => {
    setCancelPolicy(next);
    setSaveState('saving');
    await saveCancelPolicy(psicologoId, next);
    setSaveState('saved');
    setTimeout(()=>setSaveState('idle'), 1500);
  };

  const addBlock = async (b) => {
    const all = await loadBlocks();
    const updated = [...all, b];
    await saveBlocks(updated);
    setBlocks(updated.filter(x => x.psicologoId === psicologoId));
  };
  const removeBlock = async (id) => {
    const all = await loadBlocks();
    const updated = all.filter(b => b.id !== id);
    await saveBlocks(updated);
    setBlocks(updated.filter(x => x.psicologoId === psicologoId));
  };
  const createSession = async (s) => {
    const all = await loadSessions();
    const updated = [...all, s];
    await saveSessions(updated);
    setSessions(updated.filter(x => x.psicologoId === psicologoId));
  };
  const createSessions = async (list) => {
    if(!list.length) return;
    const all = await loadSessions();
    const updated = [...all, ...list];
    await saveSessions(updated);
    setSessions(updated.filter(x => x.psicologoId === psicologoId));
  };
  const removeSession = async (id) => {
    const all = await loadSessions();
    const updated = all.filter(s => s.id !== id);
    await saveSessions(updated);
    setSessions(updated.filter(x => x.psicologoId === psicologoId));
  };

  const updateSession = async (id, patch) => {
    const all = await loadSessions();
    const updated = all.map(s => s.id === id ? { ...s, ...patch } : s);
    await saveSessions(updated);
    setSessions(updated.filter(x => x.psicologoId === psicologoId));
  };

  if(!availability || !cancelPolicy || !pricing) return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando agenda…</div>;

  return (
    <div>
      <div className="subtabs">
        <button className={tab==='disponibilidade'?'active':''} onClick={()=>setTab('disponibilidade')}>Disponibilidade</button>
        <button className={tab==='cancelamento'?'active':''} onClick={()=>setTab('cancelamento')}>Cancelamento</button>
        <button className={tab==='calendario'?'active':''} onClick={()=>setTab('calendario')}>Calendário</button>
      </div>
      {saveState !== 'idle' && (
        <div className="alert alert-success" style={{display:'inline-flex'}}>
          {saveState==='saving' ? 'Salvando…' : 'Configuração salva.'}
        </div>
      )}
      {tab === 'disponibilidade' && (
        <div>
          <BookingModePanel availability={availability} onChange={persistAvailability} />
          <WeeklyHoursPanel availability={availability} onChange={persistAvailability} />
          <BlocksPanel psicologoId={psicologoId} blocks={blocks} onAdd={addBlock} onRemove={removeBlock} />
          <TestSlotPanel psicologoId={psicologoId} availability={availability} blocks={blocks} sessions={sessions}
                         patients={patients} onSessionCreated={createSession} onSessionRemoved={removeSession} />
        </div>
      )}
      {tab === 'cancelamento' && (
        <CancelPolicyPanel policy={cancelPolicy} onChange={persistCancelPolicy} />
      )}
      {tab === 'calendario' && (
        <CalendarioView
          psicologoId={psicologoId} availability={availability} blocks={blocks} sessions={sessions} patients={patients} pricing={pricing}
          onCreateSession={createSession} onCreateSessions={createSessions} onUpdateSession={updateSession}
        />
      )}
    </div>
  );
}

/* ---------- Private notes (US-010) ---------- */
function TagInput({ tags, onChange }){
  const [draft, setDraft] = useState('');
  const addTag = () => {
    const t = draft.trim();
    if(t && !tags.includes(t)) onChange([...tags, t]);
    setDraft('');
  };
  const removeTag = (t) => onChange(tags.filter(x => x !== t));
  return (
    <div>
      {tags.length > 0 && (
        <div className="tag-input-row">
          {tags.map(t => (
            <span className="tag-chip" key={t}>{t}<button type="button" onClick={()=>removeTag(t)} aria-label={`Remover tag ${t}`}>×</button></span>
          ))}
        </div>
      )}
      <input value={draft} onChange={e=>setDraft(e.target.value)}
             onKeyDown={e=>{ if(e.key==='Enter' || e.key===','){ e.preventDefault(); addTag(); } }}
             onBlur={addTag}
             placeholder="Digite uma tag e pressione Enter" />
    </div>
  );
}

function NoteForm({ sessions, editingNote, onCancel, onSave }){
  const [text, setText] = useState(editingNote?.text || '');

  const [sessionIdSel, setSessionIdSel] = useState(editingNote?.sessionId || '');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError('');
    if(!text.trim()){ setError('Escreva o conteúdo da nota.'); return; }
    setBusy(true);
    try{
      await onSave({ text: text.trim(), tags, sessionId: sessionIdSel || null });
    }catch(e){
      setError('Não foi possível salvar a nota agora.');
    }finally{
      setBusy(false);
    }
  };

  return (
    <div className="panel" style={{borderColor:'var(--ink)', borderWidth:1.5}}>
      <div className="confidential-banner">
        <IconLock size={14}/> <span>Conteúdo confidencial — nunca é exibido ao paciente.</span>
      </div>
      {error && <div className="alert alert-danger">{error}</div>}
      <div className="field">
        <label>Nota</label>
        <textarea value={text} onChange={e=>setText(e.target.value)} style={{minHeight:120}} placeholder="Registre observações clínicas sobre o acompanhamento..." />
      </div>

        <label>Vincular a uma sessão <span style={{fontWeight:400, color:'var(--ink-faint)'}}>(opcional)</span></label>
        <select value={sessionIdSel} onChange={e=>setSessionIdSel(e.target.value)}>

        </select>
      </div>
      <div className="field">
        <label>Tags <span style={{fontWeight:400, color:'var(--ink-faint)'}}>(opcional)</span></label>
        <TagInput tags={tags} onChange={setTags} />

      <div className="modal-actions">

function PatientRecordView({ patient, psicologoId, currentUserId, onBack }){
  const [sessions, setSessions] = useState([]);
  const [notes, setNotes] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [editingNote, setEditingNote] = useState(null);
  const [loading, setLoading] = useState(true);

  const refresh = useCallback(async () => {
    const [s, n] = await Promise.all([loadSessions(), loadNotes()]);
    setSessions(
      s.filter(x => x.psicologoId === psicologoId && x.patientId === patient.id)
       .sort((a,b) => (b.date+b.startTime).localeCompare(a.date+a.startTime))
    );
    setNotes(
      n.filter(x => x.psicologoId === psicologoId && x.patientId === patient.id && !x.deleted)
       .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))
    );
    setLoading(false);
  }, [psicologoId, patient.id]);

  useEffect(() => { refresh(); }, [refresh]);

  const saveNote = async (data) => {
    const all = await loadNotes();
    if(editingNote){
      const updated = all.map(n => n.id === editingNote.id ? { ...n, ...data, updatedAt:new Date().toISOString() } : n);
      await saveNotes(updated);
      await pushAudit({ userId:currentUserId, action:'nota_editada', patientId:patient.id, noteId:editingNote.id });
    } else {
      const newNote = { id: noteId(), psicologoId, patientId: patient.id, ...data, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), deleted:false };
      await saveNotes([...all, newNote]);
      await pushAudit({ userId:currentUserId, action:'nota_criada', patientId:patient.id, noteId:newNote.id });
    }
    setShowForm(false);
    setEditingNote(null);
    await refresh();
  };

  const deleteNote = async (n) => {
    const all = await loadNotes();
    const updated = all.map(x => x.id === n.id ? { ...x, deleted:true, deletedAt:new Date().toISOString() } : x);
    await saveNotes(updated); // soft-delete: preserva a nota e a trilha de auditoria
    await pushAudit({ userId:currentUserId, action:'nota_excluida', patientId:patient.id, noteId:n.id });
    await refresh();
  };

  const exportRecord = async () => {
    const lines = [];
    lines.push(`Prontuário — ${patient.socialName || patient.name}`);
    lines.push(`Exportado em ${formatDate(new Date().toISOString())}`);
    lines.push('');
    lines.push('== Sessões ==');
    if(sessions.length === 0) lines.push('Nenhuma sessão registrada.');
    sessions.forEach(s => lines.push(`${formatDateOnly(s.date)} ${s.startTime} — ${s.status} — ${s.modalidade || 'Presencial'}`));
    lines.push('');
    lines.push('== Notas privadas ==');
    if(notes.length === 0) lines.push('Nenhuma nota registrada.');
    notes.forEach(n => {
      lines.push(`[${formatDate(n.createdAt)}]${n.tags.length ? ' ('+n.tags.join(', ')+')' : ''}`);
      lines.push(n.text);
      lines.push('');
    });
    const blob = new Blob([lines.join('\n')], { type:'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `prontuario-${(patient.name||'paciente').replace(/\s+/g,'-').toLowerCase()}.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    await pushAudit({ userId: currentUserId, action:'prontuario_exportado', patientId: patient.id });
  };

  if(loading) return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando prontuário…</div>;

  return (
    <div>
      <button className="btn-link" onClick={onBack} style={{marginBottom:14, display:'inline-flex', alignItems:'center', gap:4}}>
        <IconChevronLeft size={14}/> Voltar para pacientes
      </button>
      <div className="confidential-banner">
        <IconLock size={15}/> <span>Notas privadas — visíveis apenas para você. Nunca aparecem para o paciente.</span>
      </div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10}}>
        <h2 style={{margin:0, fontSize:19}}>{patient.socialName || patient.name}</h2>
        <div style={{display:'flex', gap:8}}>
          <button className="btn-secondary" style={{width:'auto', padding:'8px 14px'}} onClick={exportRecord}>Exportar prontuário</button>
          {!showForm && (
            <button className="btn-new" onClick={()=>{ setEditingNote(null); setShowForm(true); }}><IconPlus size={15}/> Nova nota</button>
          )}
        </div>
      </div>

      {showForm && (
        <NoteForm sessions={sessions} editingNote={editingNote}
                  onCancel={()=>{ setShowForm(false); setEditingNote(null); }} onSave={saveNote} />
      )}

      {notes.length === 0 && !showForm ? (
        <div className="empty-state">
          <div className="icon-wrap"><IconNote size={24}/></div>
          <h2>Nenhuma nota ainda</h2>
          <p>Registre observações confidenciais sobre o acompanhamento deste paciente.</p>
        </div>
      ) : (
        notes.map(n => {
          const linkedSession = n.sessionId ? sessions.find(s => s.id === n.sessionId) : null;
          return (
            <div className="note-card" key={n.id}>
              <div className="note-date">
                {formatDate(n.createdAt)}{n.updatedAt && n.updatedAt !== n.createdAt ? ' · editado' : ''}
                {linkedSession ? ` · sessão de ${formatDateOnly(linkedSession.date)}` : ''}
              </div>
              <div className="note-text">{n.text}</div>
              {n.tags.length > 0 && (
                <div className="note-tags">{n.tags.map(t => <span className="note-tag" key={t}>{t}</span>)}</div>
              )}
              <div className="note-actions">
                <button className="btn-link" onClick={()=>{ setEditingNote(n); setShowForm(true); }}>Editar</button>
                <button className="btn-link" style={{color:'var(--danger)'}} onClick={()=>deleteNote(n)}>Excluir</button>
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

            <label>Frequência</label>

              <option value="diaria">Diária</option>

            </select>
          </div>
          <div className="field full">
            <label>Vincular a uma sessão <span style={{fontWeight:400, color:'var(--ink-faint)'}}>(opcional)</span></label>
            <select value={sessionIdSel} onChange={e=>setSessionIdSel(e.target.value)}>

function TarefasPsicologo({ psicologoId }){
  const [tasks, setTasks] = useState(null);
  const [patients, setPatients] = useState([]);
  const [patientFilter, setPatientFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [showForm, setShowForm] = useState(false);
  const [editingTask, setEditingTask] = useState(null);

  const refresh = useCallback(async () => {
    const [t, p] = await Promise.all([loadTasks(), loadPatients()]);
    setTasks(t.filter(x => x.psicologoId === psicologoId));
    setPatients(p.filter(x => x.psicologoId === psicologoId && x.status === 'ativo'));
  }, [psicologoId]);

  useEffect(() => { refresh(); }, [refresh]);

  const saveTask = async (data) => {
    const all = await loadTasks();
    const patient = patients.find(p => p.id === data.patientId);
    if(editingTask){
      const updated = all.map(t => t.id === editingTask.id ? { ...t, ...data } : t);
      await saveTasks(updated);
    } else {
      const now = new Date().toISOString();
      const newTask = {
        id: taskId(), psicologoId, status:'pendente', createdAt: now,
        history: [{ status:'pendente', changedAt: now, by:'psicologo' }],
        patientResponse: '', patientLinks: [],
        ...data,
      };
      await saveTasks([...all, newTask]);
      if(patient){
        await pushPatientNotification(patient.email, { type:'tarefa', message:`Nova tarefa: "${data.title}"` });
      }
    }
    setShowForm(false);
    setEditingTask(null);
    await refresh();
  };

  const toggleCancel = async (task) => {
    const all = await loadTasks();
    const newStatus = task.status === 'cancelada' ? 'pendente' : 'cancelada';
    const now = new Date().toISOString();
    const updated = all.map(t => t.id === task.id
      ? { ...t, status:newStatus, history:[...(t.history||[]), { status:newStatus, changedAt:now, by:'psicologo' }] }
      : t);
    await saveTasks(updated);
    await refresh();
  };

  if(tasks === null){
    return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando tarefas…</div>;
  }

  const frequencyLabel = { unica:'Única', diaria:'Diária', semanal:'Semanal' };
  const statusLabel = { pendente:'Pendente', em_andamento:'Em andamento', concluida:'Concluída', cancelada:'Cancelada' };

  const filtered = tasks.filter(t => {
    if(patientFilter !== 'all' && t.patientId !== patientFilter) return false;
    if(statusFilter !== 'all' && t.status !== statusFilter) return false;
    return true;
  }).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  return (
    <div>
      <div className="toolbar">
        <select value={patientFilter} onChange={e=>setPatientFilter(e.target.value)}>
          <option value="all">Todos os pacientes</option>
          {patients.map(p => <option key={p.id} value={p.id}>{p.socialName||p.name}</option>)}
        </select>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="all">Todos os status</option>
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em andamento</option>
          <option value="concluida">Concluída</option>
          <option value="cancelada">Cancelada</option>
        </select>
        <button className="btn-new" onClick={()=>{ setEditingTask(null); setShowForm(true); }}><IconPlus size={15}/> Nova tarefa</button>
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">
          <div className="icon-wrap"><IconTask size={24}/></div>
          <h2>{tasks.length === 0 ? 'Nenhuma tarefa ainda' : 'Nada por aqui'}</h2>
          <p>{tasks.length === 0
            ? 'Crie a primeira tarefa de casa para um paciente.'
            : 'Nenhuma tarefa corresponde aos filtros selecionados.'}</p>
          {tasks.length === 0 && (
            <button className="btn-primary" style={{marginTop:16, width:'auto', padding:'10px 20px'}} onClick={()=>{ setEditingTask(null); setShowForm(true); }}>
              <IconPlus size={15}/> Nova tarefa
            </button>
          )}
        </div>
      ) : (
        filtered.map(t => {
          const patient = patients.find(p => p.id === t.patientId);
          const isLate = t.dueDate && t.dueDate < todayStr() && (t.status === 'pendente' || t.status === 'em_andamento');
          const displayStatus = isLate ? 'atrasada' : t.status;
          return (
            <div className="task-card" key={t.id}>
              <div className="tc-top">
                <div>
                  <div className="tc-title">{t.title}</div>
                  <div className="tc-patient">{patient ? (patient.socialName||patient.name) : 'Paciente removido'}</div>
                </div>
                <span className={'badge status-'+displayStatus}>{isLate ? 'Atrasada' : statusLabel[t.status]}</span>
              </div>
              <div className="tc-instructions">{t.instructions}</div>
              <div className="tc-meta-row">
                <span>Frequência: {frequencyLabel[t.frequency]}</span>
                {t.dueDate && <span>Prazo: {formatDateOnly(t.dueDate)}</span>}
                {t.sessionId && <span>Vinculada a uma sessão</span>}
              </div>
              {t.links && t.links.length > 0 && (
                <div className="tc-links">
                  {t.links.map((l,i) => <a key={i} href={l} target="_blank" rel="noopener noreferrer">{l}</a>)}
                </div>
              )}
              {(t.patientResponse || (t.patientLinks && t.patientLinks.length > 0)) && (
                <div style={{marginTop:10, padding:'10px 12px', background:'var(--surface-alt)', borderRadius:10}}>
                  <div style={{fontSize:11, fontWeight:700, color:'var(--ink-muted)', marginBottom:4}}>Resposta do paciente</div>
                  {t.patientResponse && <div style={{fontSize:12.5, color:'var(--ink)', whiteSpace:'pre-wrap'}}>{t.patientResponse}</div>}
                  {t.patientLinks && t.patientLinks.length > 0 && (
                    <div className="tc-links" style={{marginTop:6}}>
                      {t.patientLinks.map((l,i) => <a key={i} href={l} target="_blank" rel="noopener noreferrer">{l}</a>)}
                    </div>
                  )}
                </div>
              )}
              {t.history && t.history.length > 1 && (
                <div style={{marginTop:8, fontSize:11, color:'var(--ink-faint)'}}>
                  Histórico: {t.history.map((h,i) => `${statusLabel[h.status]||h.status} (${h.by === 'paciente' ? 'paciente' : 'você'}, ${formatDate(h.changedAt)})`).join(' → ')}
                </div>
              )}
              <div className="tc-actions">
                <button className="btn-link" onClick={()=>{ setEditingTask(t); setShowForm(true); }}>Editar</button>
                <button className="btn-link" style={{color: t.status==='cancelada' ? 'var(--primary-dark)' : 'var(--danger)'}} onClick={()=>toggleCancel(t)}>
                  {t.status === 'cancelada' ? 'Reativar' : 'Cancelar tarefa'}
                </button>
              </div>
            </div>
          );
        })
      )}

      {showForm && (
        <TaskFormModal psicologoId={psicologoId} patients={patients} editingTask={editingTask}
                        onClose={()=>{ setShowForm(false); setEditingTask(null); }} onSave={saveTask} />
      )}
    </div>
  );
}

/* ---------- Financeiro: Preços (US-014) ---------- */
function PrecosPanel({ psicologoId }){
  const [pricing, setPricing] = useState(null);
  const [saveState, setSaveState] = useState('idle');

  useEffect(() => { (async () => setPricing(await loadPricing(psicologoId)))(); }, [psicologoId]);

  const update = async (next) => {
    setPricing(next);
    setSaveState('saving');
    await savePricing(psicologoId, next);
    setSaveState('saved');
    setTimeout(()=>setSaveState('idle'), 1500);
  };

  if(!pricing) return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando…</div>;

  return (
    <div className="panel">
      <h3>Valor padrão por tipo de sessão</h3>
      <div className="panel-sub">Usado automaticamente ao criar novas sessões. Alterar aqui não modifica sessões já criadas.</div>
      {saveState !== 'idle' && (
        <div className="alert alert-success" style={{display:'inline-flex', marginBottom:14}}>
          {saveState==='saving' ? 'Salvando…' : 'Salvo.'}
        </div>
      )}
      <div className="inline-fields">
        <div className="field">
          <label>Sessão presencial (R$)</label>
          <input type="number" min="0" step="10" value={pricing.presencial} onChange={e=>update({ ...pricing, presencial:Number(e.target.value)||0 })} />
        </div>
        <div className="field">
          <label>Sessão online (R$)</label>
          <input type="number" min="0" step="10" value={pricing.online} onChange={e=>update({ ...pricing, online:Number(e.target.value)||0 })} />
        </div>
      </div>
      <div className="field hint">Para um valor específico de um paciente, edite o cadastro dele em "Pacientes" — ele sempre sobrepõe o padrão acima.</div>
    </div>
  );
}

function ReceiptsPanel({ psicologoId }){
  const [receipts, setReceipts] = useState(null);
  const [patients, setPatients] = useState([]);

  const refresh = useCallback(async () => {
    const [r, p] = await Promise.all([loadReceipts(), loadPatients()]);
    setReceipts(r.filter(x => x.psicologoId === psicologoId).sort((a,b) => new Date(b.issuedAt) - new Date(a.issuedAt)));
    setPatients(p.filter(x => x.psicologoId === psicologoId));
  }, [psicologoId]);

  useEffect(() => { refresh(); }, [refresh]);

  const cancelReceipt = async (receipt) => {
    const all = await loadReceipts();
    const updated = all.map(r => r.id === receipt.id ? { ...r, status:'cancelado' } : r);
    await saveReceipts(updated);
    await refresh();
  };

  const reissue = async (receipt) => {
    const all = await loadReceipts();
    const number = 'REC-' + String(all.filter(r=>r.psicologoId===psicologoId).length + 1).padStart(4, '0');
    const newReceipt = { ...receipt, id: receiptId(), number, status:'emitido', issuedAt:new Date().toISOString(), supersedes:receipt.number };
    await saveReceipts([...all, newReceipt]);
    generateReceiptPDF(newReceipt);
    await refresh();
  };

  if(receipts === null) return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando recibos…</div>;

  if(receipts.length === 0){
    return (
      <div className="empty-state">
        <div className="icon-wrap"><IconWallet size={24}/></div>
        <h2>Nenhum recibo emitido ainda</h2>
        <p>Emita recibos a partir de cobranças pagas, na aba "Recebimentos".</p>
      </div>
    );
  }

  return (
    <div>
      {receipts.map(r => {
        const patient = patients.find(p => p.id === r.patientId);
        return (
          <div className="receipt-card" key={r.id}>
            <div>
              <div className="rc-num">{r.number}</div>
              <div className="rc-meta">
                {patient ? (patient.socialName||patient.name) : r.patientName} · {formatCurrency(r.amount)} · {formatDateOnly(r.date)}
                {r.supersedes ? ` · substitui ${r.supersedes}` : ''}
              </div>
            </div>
            <div className="rc-actions">
              <span className={'badge status-'+r.status}>{r.status === 'cancelado' ? 'Cancelado' : 'Emitido'}</span>
              <button className="btn-link" onClick={()=>generateReceiptPDF(r)}>Baixar PDF</button>
              {r.status === 'emitido' && (
                <button className="btn-link" style={{color:'var(--danger)'}} onClick={()=>cancelReceipt(r)}>Cancelar</button>
              )}
              {r.status === 'cancelado' && (
                <button className="btn-link" onClick={()=>reissue(r)}>Emitir substituto</button>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------- Receivables — psicólogo (US-015) ---------- */
function ChargeFormModal({ patients, presetSession, onClose, onSave }){
  const [patientIdSel, setPatientIdSel] = useState(presetSession ? presetSession.patientId : (patients[0]?.id || ''));
  const [description, setDescription] = useState(presetSession ? `Sessão de ${formatDateOnly(presetSession.date)}` : '');
  const [amount, setAmount] = useState(presetSession ? presetSession.valor : DEFAULT_SESSION_PRICE);
  const [dueDate, setDueDate] = useState(presetSession ? presetSession.date : todayStr());
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError('');
    if(!patientIdSel){ setError('Selecione um paciente.'); return; }
    if(!description.trim()){ setError('Descreva a cobrança.'); return; }
    if(!(Number(amount) > 0)){ setError('Informe um valor válido.'); return; }
    setBusy(true);
    try{
      await onSave({
        patientId: patientIdSel, sessionId: presetSession ? presetSession.id : null,
        description: description.trim(), amount: Number(amount), dueDate: dueDate || null,
      });
      onClose();
    }catch(e){
      setError('Não foi possível criar a cobrança agora.');
    }finally{
      setBusy(false);
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box form-modal" onClick={e=>e.stopPropagation()}>
        <h3>{presetSession ? 'Gerar cobrança da sessão' : 'Nova cobrança avulsa'}</h3>
        {error && <div className="alert alert-danger">{error}</div>}
        <div className="form-grid">
          <div className="field full">
            <label>Paciente</label>
            <select value={patientIdSel} onChange={e=>setPatientIdSel(e.target.value)} disabled={!!presetSession}>
              <option value="">Selecione</option>
              {patients.map(p => <option key={p.id} value={p.id}>{p.socialName || p.name}</option>)}
            </select>
          </div>
          <div className="field full">
            <label>Descrição</label>
            <input value={description} onChange={e=>setDescription(e.target.value)} placeholder="Ex.: Sessão avulsa, pacote de 4 sessões..." />
          </div>
          <div className="field">
            <label>Valor (R$)</label>
            <input type="number" min="0" step="10" value={amount} onChange={e=>setAmount(e.target.value)} />
          </div>
          <div className="field">
            <label>Vencimento <span style={{fontWeight:400, color:'var(--ink-faint)'}}>(opcional)</span></label>
            <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} />
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn-secondary" type="button" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" type="button" onClick={submit} disabled={busy}>
            {busy && <span className="spinner"/>}
            {busy ? 'Salvando…' : 'Criar cobrança'}
          </button>
        </div>
      </div>
    </div>
  );
}

function RecebimentosPanel({ psicologoId, professionalName }){
  const [charges, setCharges] = useState(null);
  const [patients, setPatients] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [receipts, setReceipts] = useState([]);
  const [patientFilter, setPatientFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [showChargeForm, setShowChargeForm] = useState(false);
  const [presetSession, setPresetSession] = useState(null);
  const [payingCharge, setPayingCharge] = useState(null);

  const refresh = useCallback(async () => {
    const [c, p, s, r] = await Promise.all([loadCharges(), loadPatients(), loadSessions(), loadReceipts()]);
    setCharges(c.filter(x => x.psicologoId === psicologoId));
    setPatients(p.filter(x => x.psicologoId === psicologoId));
    setSessions(s.filter(x => x.psicologoId === psicologoId));
    setReceipts(r.filter(x => x.psicologoId === psicologoId));
  }, [psicologoId]);

  useEffect(() => { refresh(); }, [refresh]);

  const saveCharge = async (data) => {
    const all = await loadCharges();
    const newCharge = { id: chargeId(), psicologoId, status:'pendente', paidAmount:0, payments:[], createdAt:new Date().toISOString(), ...data };
    await saveCharges([...all, newCharge]);
    setShowChargeForm(false);
    setPresetSession(null);
    await refresh();
  };

  const issueReceipt = async (charge) => {
    const patient = patients.find(p => p.id === charge.patientId);
    const allReceipts = await loadReceipts();
    const number = 'REC-' + String(allReceipts.filter(r=>r.psicologoId===psicologoId).length + 1).padStart(4, '0');
    const newReceipt = {
      id: receiptId(), psicologoId, chargeId: charge.id, patientId: charge.patientId, number,
      professionalName, patientName: patient ? (patient.socialName||patient.name) : 'Paciente',
      service: charge.description, date: charge.dueDate || todayStr(), amount: charge.paidAmount || charge.amount,
      status:'emitido', issuedAt:new Date().toISOString(), supersedes:null,
    };
    await saveReceipts([...allReceipts, newReceipt]);
    generateReceiptPDF(newReceipt);
    await refresh();
  };

  const registerPayment = async (data) => {
    const all = await loadCharges();
    const updated = all.map(c => {
      if(c.id !== payingCharge.id) return c;
      const newPaid = Math.min(c.amount, (c.paidAmount || 0) + data.amount);
      const status = newPaid >= c.amount ? 'pago' : 'parcial';
      return { ...c, paidAmount:newPaid, status, payments:[...(c.payments||[]), data] };
    });
    await saveCharges(updated);
    setPayingCharge(null);
    await refresh();
  };

  const cancelCharge = async (charge) => {
    const all = await loadCharges();
    const updated = all.map(c => c.id === charge.id ? { ...c, status:'cancelado' } : c);
    await saveCharges(updated);
    await refresh();
  };

  const refundCharge = async (charge) => {
    const all = await loadCharges();
    const updated = all.map(c => c.id === charge.id ? { ...c, status:'reembolsado' } : c);
    await saveCharges(updated);
    await refresh();
  };

  if(charges === null){
    return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando recebimentos…</div>;
  }

  const chargedSessionIds = new Set(charges.map(c => c.sessionId).filter(Boolean));
  const readySessions = sessions.filter(s => s.status === 'realizada' && !chargedSessionIds.has(s.id))
                                 .sort((a,b) => (b.date+b.startTime).localeCompare(a.date+a.startTime));

  const statusLabel = { pendente:'Pendente', pago:'Pago', vencido:'Vencido', cancelado:'Cancelado', reembolsado:'Reembolsado', parcial:'Parcialmente pago' };

  const filtered = charges.filter(c => {
    if(patientFilter !== 'all' && c.patientId !== patientFilter) return false;
    const isOverdue = c.status === 'pendente' && c.dueDate && c.dueDate < todayStr();
    const effectiveStatus = isOverdue ? 'vencido' : c.status;
    if(statusFilter !== 'all' && effectiveStatus !== statusFilter) return false;
    return true;
  }).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  return (
    <div>
      {readySessions.length > 0 && (
        <div className="panel">
          <h3>Sessões realizadas sem cobrança</h3>
          <div className="panel-sub">Gere a cobrança em um clique — o valor vem da sessão.</div>
          {readySessions.map(s => {
            const patient = patients.find(p => p.id === s.patientId);
            return (
              <div className="quick-charge-row" key={s.id}>
                <span>{patient ? (patient.socialName||patient.name) : 'Paciente removido'} — {formatDateOnly(s.date)} às {s.startTime} — {formatCurrency(s.valor)}</span>
                <button className="btn-link" onClick={()=>{ setPresetSession(s); setShowChargeForm(true); }}>Gerar cobrança</button>
              </div>
            );
          })}
        </div>
      )}

      <div className="toolbar">
        <select value={patientFilter} onChange={e=>setPatientFilter(e.target.value)}>
          <option value="all">Todos os pacientes</option>
          {patients.map(p => <option key={p.id} value={p.id}>{p.socialName||p.name}</option>)}
        </select>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="all">Todos os status</option>
          <option value="pendente">Pendente</option>
          <option value="parcial">Parcialmente pago</option>
          <option value="pago">Pago</option>
          <option value="vencido">Vencido</option>
          <option value="cancelado">Cancelado</option>
          <option value="reembolsado">Reembolsado</option>
        </select>
        <button className="btn-new" onClick={()=>{ setPresetSession(null); setShowChargeForm(true); }}><IconPlus size={15}/> Nova cobrança avulsa</button>
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">
          <div className="icon-wrap"><IconWallet size={24}/></div>
          <h2>{charges.length === 0 ? 'Nenhuma cobrança ainda' : 'Nada por aqui'}</h2>
          <p>{charges.length === 0
            ? 'Gere uma cobrança a partir de uma sessão realizada ou crie uma avulsa.'
            : 'Nenhuma cobrança corresponde aos filtros selecionados.'}</p>
        </div>
      ) : (
        filtered.map(c => {
          const patient = patients.find(p => p.id === c.patientId);
          const isOverdue = c.status === 'pendente' && c.dueDate && c.dueDate < todayStr();
          const displayStatus = isOverdue ? 'vencido' : c.status;
          const canPay = c.status === 'pendente' || c.status === 'parcial';
          const canCancel = c.status === 'pendente' || c.status === 'parcial';
          const canRefund = c.status === 'pago' || c.status === 'parcial';
          const hasActiveReceipt = receipts.some(r => r.chargeId === c.id && r.status === 'emitido');
          const canIssueReceipt = (c.status === 'pago' || c.status === 'parcial') && !hasActiveReceipt;
          return (
            <div className="charge-card" key={c.id}>
              <div className="cc-top">
                <div>
                  <div className="cc-title">{c.description}</div>
                  <div className="cc-sub">{patient ? (patient.socialName||patient.name) : 'Paciente removido'}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div className="cc-amount">{formatCurrency(c.amount)}</div>
                  <span className={'badge status-'+displayStatus}>{statusLabel[displayStatus]}</span>
                </div>
              </div>
              <div className="cc-meta-row">
                {c.dueDate && <span>Vencimento: {formatDateOnly(c.dueDate)}</span>}
                {c.sessionId && <span>Vinculada a uma sessão</span>}
                {c.paidAmount > 0 && <span>Pago até agora: {formatCurrency(c.paidAmount)}</span>}
                {hasActiveReceipt && <span>Recibo já emitido</span>}
              </div>
              {c.payments && c.payments.length > 0 && (
                <div className="cc-payments">
                  {c.payments.map((p,i) => (
                    <div key={i}>{formatDateOnly(p.date)} · {p.method} · {formatCurrency(p.amount)}{p.proof ? ' · comprovante: '+p.proof : ''}</div>
                  ))}
                </div>
              )}
              <div className="cc-actions">
                {canPay && <button className="btn-link" onClick={()=>setPayingCharge(c)}>Registrar pagamento</button>}
                {canIssueReceipt && <button className="btn-link" style={{fontWeight:700}} onClick={()=>issueReceipt(c)}>Emitir recibo (PDF)</button>}
                {canCancel && <button className="btn-link" style={{color:'var(--danger)'}} onClick={()=>cancelCharge(c)}>Cancelar</button>}
                {canRefund && <button className="btn-link" style={{color:'var(--danger)'}} onClick={()=>refundCharge(c)}>Marcar como reembolsado</button>}
              </div>
            </div>
          );
        })
      )}

      {showChargeForm && (
        <ChargeFormModal patients={patients} presetSession={presetSession}
                          onClose={()=>{ setShowChargeForm(false); setPresetSession(null); }} onSave={saveCharge} />
      )}
      {payingCharge && (
        <PaymentFormModal charge={payingCharge} onClose={()=>setPayingCharge(null)} onSave={registerPayment} />
      )}
    </div>
  );
}

/* ---------- App ---------- */

  const [currentUser, setCurrentUser] = useState(null);

  const [loaded, setLoaded] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [showProfile, setShowProfile] = useState(false);
  const [sessionNotice, setSessionNotice] = useState('');
  const lastActivityRef = React.useRef(Date.now());

  // Restaura sessão real do Supabase Auth ao carregar
  useEffect(() => {
    (async () => {
      try{
        const { data } = await supabase.auth.getSession();
        if(data.session){
          const profile = await fetchProfile(data.session.user.id);
          if(profile) setCurrentUser({ ...profile, emailVerified: !!data.session.user.email_confirmed_at });
        }
        const savedSection = await window.storage.get('ui:last-section');
        if(savedSection && savedSection.value) setSection(JSON.parse(savedSection.value));
      }catch(e){ /* sem sessão salva ainda */ }
      setLoaded(true);
    })();

    // Mantém o currentUser sincronizado com eventos reais de auth (refresh de token, logout em outra aba, etc.)
    const { data: sub } = supabase.auth.onAuthStateChange((event, session) => {
      if(event === 'SIGNED_OUT'){
        setCurrentUser(null);
      }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if(!loaded) return;
    window.storage.set('ui:last-section', JSON.stringify(section)).catch(()=>{});
  }, [section, loaded]);

  // Aplica a cor de tema do consultório (US-031) — do psicólogo direto, ou do psicólogo vinculado ao paciente
  useEffect(() => {
    if(!currentUser) { applyTheme('green'); return; }
    (async () => {
      let targetPsicologoId = null;
      if(currentUser.role === 'psicologo'){
        targetPsicologoId = currentUser.id;
      } else {
        const patients = await loadPatients();
        const record = patients.find(p => p.email.toLowerCase() === currentUser.email.toLowerCase());
        targetPsicologoId = record ? record.psicologoId : null;
      }
      const key = targetPsicologoId ? await loadThemeColor(targetPsicologoId) : 'green';
      applyTheme(key);
    })();
  }, [currentUser]);

  const handleAuthed = useCallback((user) => {
    setCurrentUser(user);
    setSection(user.role === 'psicologo' ? 'painel' : 'inicio');
    setSessionNotice('');
    lastActivityRef.current = Date.now();
    // A sessão em si já é persistida pelo próprio cliente do Supabase (via supabaseSessionStorage).
  }, []);

  const logout = useCallback((notice) => {
    setCurrentUser(null);
    setMenuOpen(false);
    setAuthView('login');
    if(notice) setSessionNotice(notice);
    supabase.auth.signOut().catch(()=>{});
  }, []);

  // Inactivity session expiration (real client-side timer)
  useEffect(() => {
    if(!currentUser) return;
    const markActive = () => { lastActivityRef.current = Date.now(); };
    ['mousemove','keydown','click','scroll','touchstart'].forEach(ev => window.addEventListener(ev, markActive));
    const interval = setInterval(() => {
      if(Date.now() - lastActivityRef.current > SESSION_TIMEOUT_MS){
        logout('Sua sessão expirou por inatividade. Faça login novamente para continuar.');
      }
    }, 5000);
    return () => {
      ['mousemove','keydown','click','scroll','touchstart'].forEach(ev => window.removeEventListener(ev, markActive));
      clearInterval(interval);
    };
  }, [currentUser, logout]);

  const resendVerificationEmail = async () => {
    try{ await supabase.auth.resend({ type:'signup', email: currentUser.email }); }catch(e){}
  };

  const acceptConsent = async () => {
    const acceptedAt = new Date().toISOString();
    await supabase.from('profiles').update({
      terms_accepted_at: acceptedAt, terms_version: TERMS_VERSION,
    }).eq('id', currentUser.id);
    setCurrentUser(u => ({ ...u, termsAcceptedAt: acceptedAt, termsVersion: TERMS_VERSION }));
  };

  if(!loaded) return null;

  if(!currentUser){
    return (
      <React.Fragment>
        {sessionNotice && (
          <div style={{position:'fixed', top:16, left:'50%', transform:'translateX(-50%)', zIndex:60, maxWidth:420, width:'calc(100% - 32px)'}}>
            <div className="alert alert-danger" style={{margin:0, boxShadow:'var(--shadow-lg)'}}>
              <IconClockRewind size={16} />
              <span>{sessionNotice}</span>
            </div>
          </div>
        )}
        {authView === 'login' && <LoginScreen onLogin={handleAuthed} goRegister={()=>setAuthView('register')} goForgot={()=>setAuthView('forgot')} />}
        {authView === 'register' && <RegisterScreen onRegister={handleAuthed} goLogin={()=>setAuthView('login')} />}
        {authView === 'forgot' && <ForgotPasswordScreen goLogin={()=>setAuthView('login')} />}
      </React.Fragment>
    );
  }

  // US-002: sem consentimento válido, acesso a recursos sensíveis fica bloqueado
  if(currentUser.role === 'paciente' && !hasValidConsent(currentUser)){
    return <ConsentGateScreen user={currentUser} onAccept={acceptConsent} onLogout={()=>logout('')} />;
  }

  const role = currentUser.role;
  const nav = role === 'psicologo' ? NAV_PSICOLOGO : NAV_PACIENTE;
  const meta = SECTION_META[section] || SECTION_META[role==='psicologo'?'painel':'inicio'];
  const initials = currentUser.name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();

  const renderContent = () => {
    if(role === 'psicologo' && section === 'painel') return <PainelPsicologo psicologoId={currentUser.id} name={currentUser.name.split(' ')[0]} />;
    if(role === 'psicologo' && section === 'agenda') return <AgendaPsicologo psicologoId={currentUser.id} />;
    if(role === 'psicologo' && section === 'pacientes') return <PacientesPsicologo psicologoId={currentUser.id} />;
    if(role === 'psicologo' && section === 'sessoes') return <SessoesNotasPsicologo psicologoId={currentUser.id} currentUserId={currentUser.id} />;
    if(role === 'psicologo' && section === 'tarefas') return <TarefasPsicologo psicologoId={currentUser.id} />;
    if(role === 'psicologo' && section === 'financeiro') return <FinanceiroPsicologo psicologoId={currentUser.id} professionalName={currentUser.name} />;
    if(role === 'paciente' && section === 'inicio') return <InicioPaciente user={currentUser} />;
    if(role === 'paciente' && section === 'minhas-sessoes') return <MinhasSessoesPaciente user={currentUser} />;
    if(role === 'paciente' && section === 'minhas-tarefas') return <MinhasTarefasPaciente user={currentUser} />;
    if(role === 'paciente' && section === 'pagamentos') return <PagamentosPaciente user={currentUser} />;
    return <EmptyState builtBy={meta.builtBy} />;
  };

  return (
    <div className="app">
      {/* Desktop sidebar */}
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark"><IconSparkle size={16} color="#F4F6F2" /></div>
          <div className="brand-name">TerapIA</div>
        </div>
        <div className="nav-group-label">Navegação</div>
        {nav.map(item => (
          <button key={item.key}
                  className={'nav-item ' + (section===item.key ? 'active':'')}
                  onClick={()=>setSection(item.key)}>
            <item.icon size={17} />
            <span>{item.label}</span>
          </button>
        ))}
        <div className="sidebar-footer">
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
            <IconLock size={12} /> <strong style={{color:'var(--ink-muted)'}}>MVP em validação</strong>
          </div>
          Protótipo interativo para validação com stakeholder. Sem persistência real de produção e sem dados de pacientes de verdade.
        </div>
      </aside>

      {/* Mobile topbar */}
      <div className="mobile-topbar">
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div className="brand-mark" style={{width:24,height:24,borderRadius:7}}><IconSparkle size={12} color="#F4F6F2" /></div>
          <span className="brand-name" style={{fontSize:16}}>TerapIA</span>
        </div>
        <div style={{display:'flex', alignItems:'center'}}>
          {role === 'psicologo' && <NotificationsBell ownerId={currentUser.id} namespace="notifications" />}
          {role === 'paciente' && <NotificationsBell ownerId={currentUser.email.toLowerCase()} namespace="patientNotifications" />}
          <div className="account-menu-wrap">
            <button className="avatar" style={{width:30,height:30,fontSize:11,border:'none',cursor:'pointer'}} onClick={()=>setMenuOpen(o=>!o)}>{initials}</button>
            {menuOpen && (
              <AccountMenu user={currentUser} onLogout={()=>logout('')} onSimulateExpiry={()=>logout('Sua sessão expirou por inatividade. Faça login novamente para continuar.')} onOpenProfile={()=>{ setMenuOpen(false); setShowProfile(true); }} onClose={()=>setMenuOpen(false)} />
            )}
          </div>
        </div>
      </div>

      <div className="main">
        {!currentUser.emailVerified && (
          <div className="verify-banner">
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <IconMail size={15} />
              <span>Confirme seu e-mail para garantir o acesso completo à sua conta.</span>
            </div>
            <button onClick={resendVerificationEmail}>Reenviar e-mail</button>
          </div>
        )}

        <div className="topbar">
          <div>
            <h1>{meta.title}</h1>
            <div className="subtitle">{meta.subtitle}</div>
          </div>
          <div className="topbar-right">
            {role === 'psicologo' && <NotificationsBell ownerId={currentUser.id} namespace="notifications" />}
          {role === 'paciente' && <NotificationsBell ownerId={currentUser.email.toLowerCase()} namespace="patientNotifications" />}
            <div className="account-menu-wrap">
              <button onClick={()=>setMenuOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:8,background:'none',border:'none',cursor:'pointer'}}>
                <div className="avatar">{initials}</div>
                <IconChevronDown size={15} color="var(--ink-muted)" />
              </button>
              {menuOpen && (
                <AccountMenu user={currentUser} onLogout={()=>logout('')} onSimulateExpiry={()=>logout('Sua sessão expirou por inatividade. Faça login novamente para continuar.')} onOpenProfile={()=>{ setMenuOpen(false); setShowProfile(true); }} onClose={()=>setMenuOpen(false)} />
              )}
            </div>
          </div>
        </div>

        <div className="content">
          <div className="mvp-banner">
            <IconSparkle size={14} />
            <span>Você está vendo um artefato de validação. As telas serão preenchidas issue por issue, seguindo o backlog do Trello.</span>
          </div>
          {renderContent()}
        </div>
      </div>

      {/* Mobile bottom nav */}
      <nav className="mobile-nav">
        {nav.map(item => (
          <button key={item.key} className={section===item.key?'active':''} onClick={()=>setSection(item.key)}>
            <item.icon size={19} />
            {item.label.split(' ')[0]}
          </button>
        ))}
      </nav>

      {showProfile && role === 'psicologo' && (
        <ProfileSettingsModal psicologoId={currentUser.id} onClose={()=>setShowProfile(false)} />
      )}
    </div>
  );
}

function NotificationsBell({ ownerId, namespace='notifications' }){
  const [open, setOpen] = useState(false);
  const [list, setList] = useState([]);

  const refresh = useCallback(async () => {
    const l = await loadNotificationsFor(namespace, ownerId);
    setList(l);
  }, [ownerId, namespace]);

  useEffect(() => { refresh(); const t = setInterval(refresh, 4000); return () => clearInterval(t); }, [refresh]);

  useEffect(() => {
    if(!open) return;
    const close = (e) => { if(e.target && e.target.closest && e.target.closest('.notif-wrap')) return; setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);

  const unread = list.filter(n => !n.read).length;

  const toggle = async () => {
    const willOpen = !open;
    setOpen(willOpen);
    if(willOpen && unread > 0){
      const updated = list.map(n => ({ ...n, read:true }));
      setList(updated);
      await saveNotificationsFor(namespace, ownerId, updated);
    }
  };

  return (
    <div className="account-menu-wrap notif-wrap" style={{marginRight:4}}>
      <button className="icon-btn" style={{position:'relative', background:'none', width:34, height:34}} onClick={toggle} aria-label="Notificações">
        <IconBell size={18}/>
        {unread>0 && (
          <span style={{position:'absolute', top:0, right:0, background:'var(--danger)', color:'#fff', fontSize:9.5, fontWeight:700, borderRadius:'50%', width:15, height:15, display:'flex', alignItems:'center', justifyContent:'center'}}>{unread}</span>
        )}
      </button>
      {open && (
        <div className="account-menu" style={{width:290, maxHeight:340, overflowY:'auto'}}>
          <div className="who" style={{marginBottom:4}}><div className="name">Notificações</div></div>
          {list.length === 0 ? (
            <div style={{padding:'12px 10px', fontSize:12.5, color:'var(--ink-faint)'}}>Nenhuma notificação ainda.</div>
          ) : list.slice(0,10).map(n => (
            <div key={n.id} style={{padding:'9px 10px', borderRadius:8}}>
              <div style={{fontSize:12.5, fontWeight:600, lineHeight:1.4}}>{n.message}</div>
              <div style={{fontSize:11, color:'var(--ink-faint)', marginTop:3}}>{formatDate(n.createdAt)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ProfileSettingsModal({ psicologoId, onClose }){
  const [selected, setSelected] = useState('green');
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const key = await loadThemeColor(psicologoId);
      setSelected(key);
      setLoaded(true);
    })();
  }, [psicologoId]);

  const choose = async (key) => {
    setSelected(key);
    applyTheme(key); // aplica imediatamente (preview em tempo real)
    await saveThemeColor(psicologoId, key);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <h3>Meu perfil</h3>
        <div className="field hint" style={{marginBottom:14}}>Personalize a cor de destaque do sistema. A escolha também aparece na visão dos seus pacientes.</div>
        {loaded && (
          <div className="theme-swatches">
            {Object.entries(THEME_PALETTES).map(([key, p]) => (
              <button key={key} className={'theme-swatch '+(selected===key?'active':'')} onClick={()=>choose(key)}>
                <span className="sw-circle" style={{background:p.swatch}}>
                  {selected===key && <IconCheckCircle size={18} color="#fff"/>}
                </span>
                <span className="sw-label">{p.label}</span>
              </button>
            ))}
          </div>
        )}
        <div className="modal-actions" style={{marginTop:20}}>
          <button className="btn-primary" type="button" onClick={onClose}>Concluído</button>
        </div>
      </div>
    </div>
  );
}

function AccountMenu({ user, onLogout, onSimulateExpiry, onOpenProfile, onClose }){
  React.useEffect(() => {
    const close = (e) => {
      if(e.target && e.target.closest && e.target.closest('.account-menu-wrap')) return;
      onClose();
    };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [onClose]);
  return (
    <div className="account-menu">
      <div className="who">
        <div className="name">{user.name}</div>
        <div className="email">{user.email} · {user.role === 'psicologo' ? 'Psicólogo(a)' : 'Paciente'}</div>
      </div>
      {user.role === 'psicologo' && (
        <button className="menu-item" onClick={onOpenProfile}>
          <IconEdit size={15} /> Meu perfil
        </button>
      )}
      <button className="menu-item" onClick={onSimulateExpiry}>
        <IconClockRewind size={15} /> Simular expiração de sessão (teste)
      </button>
      <button className="menu-item danger" onClick={onLogout}>
        <IconLogOut size={15} /> Sair
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
