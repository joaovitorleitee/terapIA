<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TerapIA — MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #F4F6F2;
    --surface: #FFFFFF;
    --surface-alt: #EDF1EA;
    --ink: #1E2A22;
    --ink-muted: #5C6B60;
    --ink-faint: #8A988E;
    --primary: #3B6255;
    --primary-dark: #274238;
    --primary-soft: #DCE8E1;
    --accent: #C98A54;
    --accent-soft: #F3E4D2;
    --danger: #B3554A;
    --danger-soft: #F3DEDA;
    --warning: #C99A3B;
    --warning-soft: #F3E9CF;
    --border: #DDE3D9;
    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 20px;
    --shadow: 0 1px 2px rgba(30,42,34,0.04), 0 4px 16px rgba(30,42,34,0.06);
    --shadow-lg: 0 8px 32px rgba(30,42,34,0.10);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1,h2,h3,.display{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  button{ font-family: inherit; }
  :focus-visible{
    outline: 2px solid var(--primary);
    outline-offset: 2px;
    border-radius: 6px;
  }
  ::selection{ background: var(--primary-soft); }

  .app{ display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar{
    width: 248px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding: 20px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 6px 10px 22px 10px;
  }
  .brand-mark{
    width:30px; height:30px; border-radius:9px;
    background: linear-gradient(155deg, var(--primary) 0%, var(--primary-dark) 100%);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-name{
    font-family:'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--primary-dark);
  }
  .role-switch{
    display:flex;
    background: var(--surface-alt);
    border-radius: var(--radius-sm);
    padding: 3px;
    margin-bottom: 20px;
    gap: 3px;
  }
  .role-switch button{
    flex:1;
    border:none;
    background:transparent;
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
    cursor:pointer;
    transition: all .15s ease;
  }
  .role-switch button.active{
    background: var(--surface);
    color: var(--primary-dark);
    box-shadow: var(--shadow);
  }
  .nav-group-label{
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    padding: 4px 10px;
    margin-top: 6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding: 9px 11px;
    border-radius: 10px;
    color: var(--ink-muted);
    font-size: 14px;
    font-weight: 500;
    cursor:pointer;
    border:none;
    background:transparent;
    width:100%;
    text-align:left;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item:hover{ background: var(--surface-alt); color: var(--ink); }
  .nav-item.active{ background: var(--primary-soft); color: var(--primary-dark); }
  .nav-item svg{ flex-shrink:0; opacity:0.85; }
  .nav-item.active svg{ opacity:1; }
  .nav-item .badge{
    margin-left:auto;
    font-size:10.5px;
    font-weight:700;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 7px;
    border-radius: 999px;
  }
  .sidebar-footer{
    margin-top:auto;
    padding: 12px 10px 4px 10px;
    font-size: 11px;
    color: var(--ink-faint);
    line-height: 1.5;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  /* Main */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .topbar h1{ font-size: 22px; margin:0; }
  .topbar .subtitle{ font-size: 13px; color: var(--ink-muted); margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background: var(--primary-soft);
    color: var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px;
    font-family:'Fraunces',serif;
  }
  .content{ padding: 28px 32px 60px 32px; flex:1; }

  .mvp-banner{
    display:flex; align-items:center; gap:10px;
    background: var(--accent-soft);
    color:#7A5327;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12.5px;
    margin-bottom: 22px;
    border: 1px solid #E8CFA8;
  }

  .empty-state{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 56px 32px;
    text-align:center;
    max-width: 460px;
    margin: 40px auto;
  }
  .empty-state .icon-wrap{
    width:56px; height:56px; border-radius:16px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 18px auto;
  }
  .empty-state h2{ font-size:18px; margin:0 0 8px 0; }
  .empty-state p{ font-size:13.5px; color: var(--ink-muted); line-height:1.6; margin:0; }
  .empty-state .tag{
    display:inline-block;
    margin-top:16px;
    font-size:11px;
    font-weight:700;
    color: var(--primary-dark);
    background: var(--primary-soft);
    padding:4px 10px;
    border-radius:999px;
  }

  .welcome-card{
    background: linear-gradient(145deg, var(--primary-dark) 0%, var(--primary) 100%);
    border-radius: var(--radius-lg);
    padding: 36px;
    color: #F4F6F2;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .welcome-card::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:180px; height:180px;
    border-radius:50%;
    background: rgba(255,255,255,0.06);
  }
  .welcome-card h2{ color:#fff; font-size:24px; margin:0 0 8px 0; position:relative; }
  .welcome-card p{ color: #D9E5DE; font-size:14px; max-width:480px; line-height:1.6; margin:0; position:relative; }

  .grid-cards{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap:16px;
  }
  .stat-card{
    background: var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-card .stat-label{ font-size:12px; color:var(--ink-muted); font-weight:600; }
  .stat-card .stat-value{ font-family:'Fraunces',serif; font-size:28px; margin-top:6px; color:var(--ink); }

  /* Mobile */
  .mobile-topbar{ display:none; }
  .mobile-nav{ display:none; }

  @media (max-width: 860px){
    .sidebar{ display:none; }
    .app{ flex-direction:column; }
    .mobile-topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding: 14px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top:0; z-index:10;
    }
    .content{ padding: 20px 18px 90px 18px; }
    .topbar{ padding: 16px 18px; }
    .topbar h1{ font-size:19px; }
    .mobile-nav{
      display:flex;
      position:fixed; bottom:0; left:0; right:0;
      background: var(--surface);
      border-top:1px solid var(--border);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
      z-index: 10;
    }
    .mobile-nav button{
      flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
      background:none; border:none; padding:6px 2px;
      color: var(--ink-faint); font-size:10.5px; font-weight:600;
    }
    .mobile-nav button.active{ color: var(--primary-dark); }
  }

  /* ---------- Auth screens ---------- */
  .auth-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
    padding: 24px;
  }
  .auth-card{
    width:100%;
    max-width: 400px;
    background: var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 36px 32px;
  }
  .auth-brand{ display:flex; align-items:center; gap:10px; margin-bottom: 22px; }
  .auth-brand .brand-mark{ width:32px; height:32px; border-radius:10px; }
  .auth-brand .brand-name{ font-size:20px; }
  .auth-card h2{ font-size:20px; margin:0 0 4px 0; }
  .auth-card .auth-sub{ font-size:13px; color:var(--ink-muted); margin-bottom: 22px; }
  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .field input, .field select{
    width:100%;
    padding: 10px 12px;
    border:1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .field .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }
  .field-error{ font-size:12px; color:var(--danger); margin-top:5px; font-weight:500; }
  .role-pick{ display:flex; gap:8px; margin-bottom:16px; }
  .role-pick button{
    flex:1;
    border:1.5px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 11px 8px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    color: var(--ink-muted);
    font-size:12.5px; font-weight:600;
    transition: all .12s ease;
  }
  .role-pick button.active{
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary-dark);
  }
  .checkbox-row{
    display:flex; align-items:flex-start; gap:9px;
    font-size:12.5px; color:var(--ink-muted); line-height:1.5;
    margin-bottom:18px;
  }
  .checkbox-row input{ margin-top:2px; accent-color: var(--primary); width:15px; height:15px; flex-shrink:0; }
  .checkbox-row a{ color: var(--primary-dark); font-weight:600; text-decoration:underline; cursor:pointer; }
  .btn-primary{
    width:100%;
    background: var(--primary);
    color:#fff;
    border:none;
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition: background .12s ease, transform .05s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary:hover{ background: var(--primary-dark); }
  .btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }
  .btn-link{
    background:none; border:none; color: var(--primary-dark);
    font-size:13px; font-weight:600; cursor:pointer; padding:0;
  }
  .auth-footer-link{ text-align:center; margin-top:18px; font-size:13px; color:var(--ink-muted); }
  .alert{
    display:flex; gap:8px; align-items:flex-start;
    padding: 11px 13px; border-radius: var(--radius-sm);
    font-size:12.5px; margin-bottom:16px; line-height:1.5;
  }
  .alert-danger{ background: var(--danger-soft); color:#7A362C; }
  .alert-success{ background: var(--primary-soft); color: var(--primary-dark); }
  .spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .verify-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--warning-soft); color:#7A5A18;
    border:1px solid #E8D2A0;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size:12.5px;
    margin-bottom: 18px;
  }
  .verify-banner button{
    background: #7A5A18; color:#fff; border:none; border-radius:7px;
    padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex-shrink:0;
  }

  .account-menu-wrap{ position:relative; }
  .account-menu{
    position:absolute; right:0; top:calc(100% + 8px);
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-lg);
    width: 240px; padding:8px; z-index:20;
  }
  .account-menu .who{ padding:10px 10px 12px 10px; border-bottom:1px solid var(--border); margin-bottom:6px; }
  .account-menu .who .name{ font-weight:700; font-size:13.5px; }
  .account-menu .who .email{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
  .account-menu button.menu-item{
    width:100%; text-align:left; background:none; border:none;
    padding:9px 10px; border-radius:8px; font-size:13px; color:var(--ink);
    cursor:pointer; display:flex; align-items:center; gap:9px;
  }
  .account-menu button.menu-item:hover{ background: var(--surface-alt); }
  .account-menu button.menu-item.danger{ color: var(--danger); }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(30,42,34,0.45);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-box{
    background:var(--surface); border-radius:var(--radius-lg); max-width:480px; width:100%;
    max-height:80vh; overflow-y:auto; padding:28px; box-shadow:var(--shadow-lg);
  }
  .modal-box h3{ margin-top:0; }
  .modal-box p{ font-size:13px; color:var(--ink-muted); line-height:1.7; }

  /* ---------- Patients (US-003) ---------- */
  .toolbar{
    display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;
  }
  .toolbar .search-input{
    flex:1; min-width:180px;
    padding: 9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    font-size:13.5px; font-family:inherit; color:var(--ink); background:var(--surface);
  }
  .toolbar .search-input:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .filter-pills{ display:flex; gap:6px; }
  .filter-pill{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-muted);
    padding:7px 13px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .filter-pill.active{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary-dark); }
  .btn-new{
    background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm);
    padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px;
    white-space:nowrap;
  }
  .btn-new:hover{ background:var(--primary-dark); }

  .patient-list{ display:flex; flex-direction:column; gap:8px; }
  .patient-row{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; display:flex; align-items:center; gap:14px;
  }
  .patient-row .p-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--primary-soft); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:13px;
    flex-shrink:0;
  }
  .patient-row .p-main{ flex:1; min-width:0; }
  .patient-row .p-name{ font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .patient-row .p-sub{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .patient-row .p-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    background:var(--surface-alt); border:1px solid var(--border); border-radius:8px;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-muted); cursor:pointer;
  }
  .icon-btn:hover{ background:var(--primary-soft); color:var(--primary-dark); }
  .badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .badge-ativo{ background:var(--primary-soft); color:var(--primary-dark); }
  .badge-arquivado{ background:var(--surface-alt); color:var(--ink-faint); }
  .badge-consent-ok{ background:var(--primary-soft); color:var(--primary-dark); }
  .badge-consent-pending{ background:var(--warning-soft); color:#7A5A18; }

  .form-modal{ max-width:620px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .form-grid .field.full{ grid-column: 1 / -1; }
  .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    font-size:14px; font-family:inherit; color:var(--ink); resize:vertical; min-height:70px;
  }
  .field textarea:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .modal-actions{ display:flex; gap:10px; margin-top:8px; }
  .modal-actions .btn-secondary{
    flex:1; background:var(--surface); border:1px solid var(--border); color:var(--ink);
    border-radius:var(--radius-sm); padding:11px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .modal-actions .btn-primary{ flex:1; }

  /* ---------- Availability (US-006) ---------- */
  .subtabs{ display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--border); }
  .subtabs button{
    background:none; border:none; padding:10px 4px; margin-right:18px;
    font-size:13.5px; font-weight:600; color:var(--ink-faint); cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .subtabs button.active{ color:var(--primary-dark); border-bottom-color:var(--primary); }
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:22px 24px; margin-bottom:20px;
  }
  .panel h3{ font-size:15px; margin:0 0 4px 0; }
  .panel .panel-sub{ font-size:12.5px; color:var(--ink-muted); margin-bottom:18px; }
  .switch{
    position:relative; width:38px; height:22px; border-radius:999px; background:var(--border);
    cursor:pointer; flex-shrink:0; border:none; transition:background .15s ease;
  }
  .switch.on{ background:var(--primary); }
  .switch .knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:#fff; transition:transform .15s ease; box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .switch.on .knob{ transform:translateX(16px); }
  .day-row{
    display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--surface-alt);
  }
  .day-row:last-child{ border-bottom:none; }
  .day-row .day-label{ width:90px; font-size:13.5px; font-weight:600; flex-shrink:0; }
  .day-row input[type=time]{
    padding:7px 9px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit;
  }
  .day-row .day-disabled{ color:var(--ink-faint); font-size:12.5px; }
  .inline-fields{ display:flex; gap:16px; flex-wrap:wrap; margin-top:6px; }
  .inline-fields .field{ flex:1; min-width:140px; margin-bottom:0; }
  .block-row{
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    background:var(--surface-alt); border-radius:10px; margin-bottom:8px;
  }
  .block-row .b-info{ flex:1; font-size:13px; }
  .block-row .b-info .b-label{ font-weight:600; }

/* ---------- Painel (psicólogo) placeholder content ---------- */
function PainelPsicologo({ psicologoId, name }){
  const [loading, setLoading] = useState(true);
  const [todaySessions, setTodaySessions] = useState([]);
  const [pendingSessions, setPendingSessions] = useState([]);
  const [activeTasksCount, setActiveTasksCount] = useState(0);
  const [overdueCharges, setOverdueCharges] = useState([]);
  const [monthRevenue, setMonthRevenue] = useState(0);
  const [patients, setPatients] = useState([]);

  useEffect(() => {
    (async () => {
      const [sessions, tasks, charges, pats] = await Promise.all([loadSessions(), loadTasks(), loadCharges(), loadPatients()]);
      const mySessions = sessions.filter(s => s.psicologoId === psicologoId);
      const myTasks = tasks.filter(t => t.psicologoId === psicologoId);
      const myCharges = charges.filter(c => c.psicologoId === psicologoId);
      const myPatients = pats.filter(p => p.psicologoId === psicologoId);
      setPatients(myPatients);

      const today = todayStr();
      setTodaySessions(
        mySessions.filter(s => s.date === today && ['confirmada','pendente','agendada'].includes(s.status))
                   .sort((a,b) => a.startTime.localeCompare(b.startTime))
      );
      setPendingSessions(
        mySessions.filter(s => s.status === 'pendente')
                   .sort((a,b) => (a.date+a.startTime).localeCompare(b.date+b.startTime))
      );
      setActiveTasksCount(myTasks.filter(t => t.status === 'pendente' || t.status === 'em_andamento').length);
      setOverdueCharges(
        myCharges.filter(c => c.status === 'pendente' && c.dueDate && c.dueDate < today)
                  .sort((a,b) => a.dueDate.localeCompare(b.dueDate))
      );

      const now = new Date();
      const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      let revenue = 0;
      myCharges.forEach(c => (c.payments||[]).forEach(p => { if(p.date && p.date.startsWith(monthKey)) revenue += Number(p.amount)||0; }));
      setMonthRevenue(revenue);

      setLoading(false);
    })();
  }, [psicologoId]);

  const patientName = (id) => { const p = patients.find(x => x.id === id); return p ? (p.socialName||p.name) : 'Paciente'; };
  const sessionStatusLabel = { pendente:'Pendente', agendada:'Agendada', confirmada:'Confirmada' };

  return (
    <div>
      <div className="welcome-card">
        <h2>Bem-vindo(a), {name}.</h2>
        <p>Este é o resumo do seu consultório — indicadores calculados só a partir dos seus próprios dados.</p>
      </div>
      <div className="grid-cards">
        <div className="stat-card"><div className="stat-label">Sessões hoje</div><div className="stat-value">{loading ? '—' : todaySessions.length}</div></div>
        <div className="stat-card"><div className="stat-label">Pendentes de confirmação</div><div className="stat-value">{loading ? '—' : pendingSessions.length}</div></div>
        <div className="stat-card"><div className="stat-label">Tarefas para acompanhar</div><div className="stat-value">{loading ? '—' : activeTasksCount}</div></div>
        <div className="stat-card"><div className="stat-label">Cobranças vencidas</div><div className="stat-value">{loading ? '—' : overdueCharges.length}</div></div>
        <div className="stat-card"><div className="stat-label">Receita do mês</div><div className="stat-value" style={{fontSize:20}}>{loading ? '—' : formatCurrency(monthRevenue)}</div></div>
      </div>

      {!loading && (
        <React.Fragment>
          <div className="panel">
            <h3>Sessões de hoje</h3>
            <div className="panel-sub">Sua agenda para as próximas horas.</div>
            {todaySessions.length === 0 ? (
              <div className="field hint">Nenhuma sessão para hoje.</div>
            ) : todaySessions.map(s => (
              <div className="mini-session-row" key={s.id}>
                <span>{s.startTime} · {patientName(s.patientId)}</span>
                <span className={'badge status-'+s.status}>{sessionStatusLabel[s.status]}</span>
              </div>
            ))}
          </div>

          {pendingSessions.length > 0 && (
            <div className="panel">
              <h3>Pendentes de confirmação</h3>
              <div className="panel-sub">Solicitações de agendamento aguardando sua aprovação — acesse a Agenda para aprovar ou recusar.</div>
              {pendingSessions.map(s => (
                <div className="mini-session-row" key={s.id}>
                  <span>{formatDateOnly(s.date)} às {s.startTime} · {patientName(s.patientId)}</span>
                </div>
              ))}
            </div>
          )}

          {overdueCharges.length > 0 && (
            <div className="panel">
              <h3>Cobranças vencidas</h3>
              <div className="panel-sub">Resolva em Financeiro › Recebimentos.</div>
              {overdueCharges.map(c => (
                <div className="mini-session-row" key={c.id}>
                  <span>{patientName(c.patientId)} · {c.description} · {formatCurrency(c.amount)} · venceu em {formatDateOnly(c.dueDate)}</span>
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}
/* ---------- Patient booking (US-007) ---------- */
function BookingFlow({ psicologoId, patientId, patient, availability, blocks, sessions, pricing, onBooked, onClose }){
  const [step, setStep] = useState('date'); // date | time | confirming | done
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(null);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [resultStatus, setResultStatus] = useState(null);

  const minDate = todayStr();
  const maxDate = toDateStr(new Date(Date.now() + availability.maxAdvanceDays*24*3600*1000));

  const strip = Array.from({length:21}, (_,i) => addDays(minDate, i)).filter(d => d <= maxDate);

  const slots = React.useMemo(
    () => listAvailableSlotsForDate(date, { availability, blocks, sessions, psicologoId }),
    [date, availability, blocks, sessions, psicologoId]
  );

  const confirm = async () => {
    setError('');
    const check = checkSlotAvailability({ availability, blocks, sessions, psicologoId, date, startTime:time, durationMin: availability.defaultDurationMin });
    if(!check.available){ setError(check.reason + ' Escolha outro horário.'); setStep('time'); return; }
    setBusy(true);
    try{
      const status = availability.bookingMode === 'aprovacao' ? 'pendente' : 'confirmada';
      await onBooked({
        id: sessionId(), psicologoId, patientId, date, startTime: time,
        durationMin: availability.defaultDurationMin, modalidade:'Presencial', status,
        valor: getDefaultPrice(pricing, patient, 'Presencial'), createdAt:new Date().toISOString(),
      });
      setResultStatus(status);
      setStep('done');
    }catch(e){
      setError('Não foi possível concluir o agendamento agora. Tente novamente.');
    }finally{
      setBusy(false);
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box form-modal" onClick={e=>e.stopPropagation()}>
        {step !== 'done' && <h3>Agendar consulta</h3>}
        {error && <div className="alert alert-danger">{error}</div>}

        {step === 'date' && (
          <React.Fragment>
            <div className="field hint" style={{marginBottom:10}}>Escolha um dia</div>
            <div className="date-strip">
              {strip.map(d => {
                const dd = fromDateStr(d);
                return (
                  <div key={d} className={'date-chip '+(d===date?'active':'')} onClick={()=>setDate(d)}>
                    <div className="dc-dow">{DOW_SHORT[dd.getDay()]}</div>
                    <div className="dc-num">{dd.getDate()}</div>
                  </div>
                );
              })}
            </div>
            <div className="field hint" style={{marginBottom:10}}>Horários disponíveis em {formatDateOnly(date)}</div>
            {slots.length === 0 ? (
              <div className="empty-state" style={{margin:'12px 0', padding:'28px 16px'}}>
                <p>Nenhum horário disponível neste dia. Tente outra data.</p>
              </div>
            ) : (
              <div className="time-grid">
                {slots.map(t => (
                  <div key={t} className="time-chip" onClick={()=>{ setTime(t); setStep('confirming'); }}>{t}</div>
                ))}
              </div>
            )}
            <div className="modal-actions">
              <button className="btn-secondary" type="button" onClick={onClose}>Fechar</button>
            </div>
          </React.Fragment>
        )}

        {step === 'confirming' && (
          <React.Fragment>
            <div className="alert alert-success" style={{background:'var(--surface-alt)', color:'var(--ink)'}}>
              <strong>{formatDateOnly(date)}</strong> às <strong>{time}</strong> · {availability.defaultDurationMin} min · Presencial
            </div>
            {availability.bookingMode === 'aprovacao' && (
              <div className="field hint" style={{marginBottom:14}}>Este horário ficará reservado como pendente até seu psicólogo aprovar.</div>
            )}
            <div className="modal-actions">
              <button className="btn-secondary" type="button" onClick={()=>setStep('date')}>Voltar</button>
              <button className="btn-primary" type="button" onClick={confirm} disabled={busy}>
                {busy && <span className="spinner"/>}
                {busy ? 'Confirmando…' : 'Confirmar agendamento'}
              </button>
            </div>
          </React.Fragment>
        )}

        {step === 'done' && (
          <div style={{textAlign:'center', padding:'12px 4px'}}>
            <div className="icon-wrap" style={{margin:'0 auto 16px auto'}}><IconCheckCircle size={26}/></div>
            <h3 style={{marginBottom:8}}>{resultStatus === 'pendente' ? 'Solicitação enviada' : 'Sessão confirmada'}</h3>
            <p style={{fontSize:13, color:'var(--ink-muted)', lineHeight:1.6, marginBottom:6}}>
              {resultStatus === 'pendente'
                ? `Seu horário em ${formatDateOnly(date)} às ${time} está reservado e aguardando aprovação do seu psicólogo.`
                : `Sua sessão em ${formatDateOnly(date)} às ${time} está confirmada.`}
            </p>
            <p style={{fontSize:12, color:'var(--ink-faint)'}}>Você receberá um lembrete antes da sessão assim que as notificações forem ativadas.</p>
            <button className="btn-primary" style={{marginTop:14}} onClick={onClose}>Concluir</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Cancel & reschedule (US-008, patient-facing) ---------- */
function CancelSessionModal({ session, cancelPolicy, onClose, onConfirm }){
  const [reason, setReason] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const hoursUntil = (new Date(session.date+'T'+session.startTime+':00').getTime() - Date.now()) / 3600000;
  const isLate = hoursUntil < cancelPolicy.minHoursForFree;
  const chargeType = isLate ? cancelPolicy.lateCancelCharge : 'nenhuma';

  const submit = async () => {
    setError('');
    if(!reason.trim()){ setError('Conte rapidamente o motivo do cancelamento.'); return; }
    setBusy(true);
    try{
      await onConfirm({
        reason: reason.trim(), isLateCancel: isLate, chargeType,
        chargePercent: chargeType==='parcial' ? cancelPolicy.lateCancelPercent : null,
        pendingRelease: !cancelPolicy.autoReleaseSlot,
      });
      onClose();
    }catch(e){
      setError('Não foi possível cancelar agora. Tente novamente.');
    }finally{
      setBusy(false);
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <h3>Cancelar sessão</h3>
        {error && <div className="alert alert-danger">{error}</div>}
        <div className="field hint" style={{marginBottom:6}}>{formatDateOnly(session.date)} às {session.startTime}</div>
        <div className="alert alert-success" style={{background:'var(--surface-alt)', color:'var(--ink)'}}>{cancelPolicyText(cancelPolicy)}</div>
        <div className={'alert '+(isLate ? 'alert-danger' : 'alert-success')}>
          {isLate
            ? (chargeType==='integral' ? 'Este cancelamento está fora do prazo e terá cobrança integral.'
               : chargeType==='parcial' ? `Este cancelamento está fora do prazo e terá cobrança de ${cancelPolicy.lateCancelPercent}%.`
               : 'Este cancelamento está fora do prazo, mas a política não prevê cobrança.')
            : 'Este cancelamento está dentro do prazo gratuito e não gera cobrança.'}
        </div>
        <div className="field">
          <label>Motivo do cancelamento</label>
          <textarea value={reason} onChange={e=>setReason(e.target.value)} placeholder="Conte rapidamente o motivo" />
        </div>
        <div className="modal-actions">
          <button className="btn-secondary" type="button" onClick={onClose}>Voltar</button>
          <button className="btn-primary" type="button" onClick={submit} disabled={busy}>
            {busy && <span className="spinner"/>}
            {busy ? 'Cancelando…' : 'Confirmar cancelamento'}
          </button>
        </div>
      </div>
    </div>
  );
}

function RescheduleModal({ session, psicologoId, availability, blocks, sessions, onClose, onConfirm }){
  const [date, setDate] = useState(session.date);
  const [time, setTime] = useState(null);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const minDate = todayStr();
  const maxDate = toDateStr(new Date(Date.now() + availability.maxAdvanceDays*24*3600*1000));
  const strip = Array.from({length:21}, (_,i) => addDays(minDate, i)).filter(d => d <= maxDate);

  const slots = React.useMemo(
    () => listAvailableSlotsForDate(date, { availability, blocks, sessions, psicologoId })
            .filter(t => !(date===session.date && t===session.startTime)),
    [date, availability, blocks, sessions, psicologoId]
  );

  const submit = async () => {
    setError('');
    if(!time){ setError('Escolha um novo horário.'); return; }
    setBusy(true);
    try{
      await onConfirm({ date, time });
      onClose();
    }catch(e){
      setError('Não foi possível reagendar agora. Tente novamente.');
    }finally{
      setBusy(false);
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box form-modal" onClick={e=>e.stopPropagation()}>
        <h3>Reagendar sessão</h3>
        {error && <div className="alert alert-danger">{error}</div>}
        <div className="field hint" style={{marginBottom:10}}>Sessão atual: {formatDateOnly(session.date)} às {session.startTime}</div>
        <div className="date-strip">
          {strip.map(d => {
            const dd = fromDateStr(d);
            return (
              <div key={d} className={'date-chip '+(d===date?'active':'')} onClick={()=>{setDate(d); setTime(null);}}>
                <div className="dc-dow">{DOW_SHORT[dd.getDay()]}</div>
                <div className="dc-num">{dd.getDate()}</div>
              </div>
            );
          })}
        </div>
        <div className="field hint" style={{marginBottom:10}}>Novos horários em {formatDateOnly(date)}</div>
        {slots.length === 0 ? (
          <div className="empty-state" style={{margin:'12px 0', padding:'28px 16px'}}><p>Nenhum horário disponível neste dia. Tente outra data.</p></div>
        ) : (
          <div className="time-grid">
            {slots.map(t => (
              <div key={t} className={'time-chip '+(t===time?'selected':'')} onClick={()=>setTime(t)}>{t}</div>
            ))}
          </div>
        )}
        <div className="modal-actions">
          <button className="btn-secondary" type="button" onClick={onClose}>Voltar</button>
          <button className="btn-primary" type="button" onClick={submit} disabled={busy || !time}>
            {busy && <span className="spinner"/>}
            {busy ? 'Reagendando…' : 'Confirmar novo horário'}
          </button>
        </div>
      </div>
    </div>
  );

function MinhasSessoesPaciente({ user }){
  const [loading, setLoading] = useState(true);
  const [patientRecord, setPatientRecord] = useState(null);
  const [availability, setAvailability] = useState(null);
  const [blocks, setBlocks] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [cancelPolicy, setCancelPolicy] = useState(null);
  const [pricing, setPricing] = useState(null);
  const [showBooking, setShowBooking] = useState(false);
  const [cancelTarget, setCancelTarget] = useState(null);
  const [rescheduleTarget, setRescheduleTarget] = useState(null);

  const refresh = useCallback(async () => {
    const allPatients = await loadPatients();
    const record = allPatients.find(p => p.email.toLowerCase() === user.email.toLowerCase());
    setPatientRecord(record || null);
    if(record){
      const [a, b, s, cp, pr] = await Promise.all([
        loadAvailability(record.psicologoId), loadBlocks(), loadSessions(), loadCancelPolicy(record.psicologoId), loadPricing(record.psicologoId),
      ]);
      setAvailability(a);
      setBlocks(b.filter(x => x.psicologoId === record.psicologoId));
      setSessions(s.filter(x => x.psicologoId === record.psicologoId));
      setCancelPolicy(cp);
      setPricing(pr);
    }
    setLoading(false);
  }, [user.email]);

  useEffect(() => { refresh(); }, [refresh]);

  const bookSession = async (session) => {
    const all = await loadSessions();
    await saveSessions([...all, session]);
    await refresh();
  };

  const confirmCancel = async (data) => {
    const all = await loadSessions();
    const updated = all.map(s => s.id === cancelTarget.id
      ? { ...s, status:'cancelada', cancelledAt:new Date().toISOString(), cancelledBy:'paciente', ...data }
      : s);
    await saveSessions(updated);
    await pushNotification(patientRecord.psicologoId, {
      type:'cancelamento',
      message:`${patientRecord.socialName||patientRecord.name} cancelou a sessão de ${formatDateOnly(cancelTarget.date)} às ${cancelTarget.startTime}.`,
    });
    setCancelTarget(null);
    await refresh();
  };

  const confirmReschedule = async ({ date, time }) => {
    const all = await loadSessions();
    const newSession = {
      id: sessionId(), psicologoId: patientRecord.psicologoId, patientId: patientRecord.id, date, startTime: time,
      durationMin: rescheduleTarget.durationMin, modalidade: rescheduleTarget.modalidade || 'Presencial',
      valor: rescheduleTarget.valor ?? DEFAULT_SESSION_PRICE,
      status: availability.bookingMode === 'aprovacao' ? 'pendente' : 'confirmada',
      createdAt: new Date().toISOString(), rescheduledFromId: rescheduleTarget.id,
    };
    const updated = all.map(s => s.id === rescheduleTarget.id
      ? { ...s, status:'reagendada', rescheduledAt:new Date().toISOString(), rescheduledBy:'paciente', rescheduledToId:newSession.id }
      : s);
    updated.push(newSession);
    await saveSessions(updated);
    await pushNotification(patientRecord.psicologoId, {
      type:'reagendamento',
      message:`${patientRecord.socialName||patientRecord.name} reagendou a sessão de ${formatDateOnly(rescheduleTarget.date)} às ${rescheduleTarget.startTime} para ${formatDateOnly(date)} às ${time}.`,
    });
    setRescheduleTarget(null);
    await refresh();
  };

  if(loading) return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando…</div>;

  if(!patientRecord){
    return (
      <div className="empty-state">
        <div className="icon-wrap"><IconUserPlus size={24}/></div>
        <h2>Cadastro ainda não vinculado</h2>
        <p>Seu psicólogo ainda não te cadastrou no sistema com este e-mail ({user.email}). Assim que isso acontecer, você poderá agendar suas sessões por aqui.</p>
      </div>
    );
  }

  const mySessions = sessions.filter(s => s.patientId === patientRecord.id).sort((a,b) => (a.date+a.startTime).localeCompare(b.date+b.startTime));
  const upcoming = mySessions.filter(s => s.date >= todayStr() && (s.status === 'confirmada' || s.status === 'pendente' || s.status === 'agendada'));
  const statusLabel = { agendada:'Agendada', confirmada:'Confirmada', pendente:'Pendente de aprovação', cancelada:'Cancelada', realizada:'Realizada', reagendada:'Reagendada', falta:'Falta' };
  const canModify = (s) => (s.status === 'confirmada' || s.status === 'pendente' || s.status === 'agendada') && s.date >= todayStr();

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18, flexWrap:'wrap', gap:10}}>
        <div className="field hint" style={{margin:0}}>{upcoming.length} sessão(ões) futura(s)</div>
        <button className="btn-new" onClick={()=>setShowBooking(true)}><IconPlus size={15}/> Agendar consulta</button>
      </div>

      {mySessions.length === 0 ? (
        <div className="empty-state">
          <div className="icon-wrap"><IconCalendar size={24}/></div>
          <h2>Nenhuma sessão ainda</h2>
          <p>Agende sua primeira consulta escolhendo um horário disponível na agenda do seu psicólogo.</p>
          <button className="btn-primary" style={{marginTop:16, width:'auto', padding:'10px 20px'}} onClick={()=>setShowBooking(true)}>
            <IconPlus size={15}/> Agendar consulta
          </button>
        </div>
      ) : (
        mySessions.map(s => (
          <div className="session-card" key={s.id}>
            <div>
              <div className="sc-date">{formatDateOnly(s.date)} às {s.startTime}</div>
              <div className="sc-meta">{s.durationMin} min · {s.modalidade || 'Presencial'}</div>
            </div>
            <div style={{display:'flex', alignItems:'center', gap:10}}>
              {canModify(s) && (
                <div style={{display:'flex', gap:10}}>
                  <button className="btn-link" onClick={()=>setRescheduleTarget(s)}>Reagendar</button>
                  <button className="btn-link" style={{color:'var(--danger)'}} onClick={()=>setCancelTarget(s)}>Cancelar</button>
                </div>
              )}
              <span className={'badge status-'+s.status}>{statusLabel[s.status] || s.status}</span>
            </div>
          </div>
        ))
      )}

      {showBooking && (
        <BookingFlow
          psicologoId={patientRecord.psicologoId} patientId={patientRecord.id} patient={patientRecord}
          availability={availability} blocks={blocks} sessions={sessions} pricing={pricing}
          onBooked={bookSession} onClose={()=>setShowBooking(false)}
        />
      )}
      {cancelTarget && (
        <CancelSessionModal
          session={cancelTarget} cancelPolicy={cancelPolicy}
          onClose={()=>setCancelTarget(null)} onConfirm={confirmCancel}
        />
      )}
      {rescheduleTarget && (
        <RescheduleModal
          session={rescheduleTarget} psicologoId={patientRecord.psicologoId}
          availability={availability} blocks={blocks} sessions={sessions}
          onClose={()=>setRescheduleTarget(null)} onConfirm={confirmReschedule}
        />
      )}
    </div>
  );
}

/* ---------- Homework tasks — paciente (US-012) ---------- */
function TaskCardPaciente({ task, onUpdate }){
  const [response, setResponse] = useState(task.patientResponse || '');
  const [links, setLinks] = useState(task.patientLinks || []);
  const [saved, setSaved] = useState(true);
  const [busy, setBusy] = useState(false);

  const isClosed = task.status === 'concluida' || task.status === 'cancelada';
  const isLate = task.dueDate && task.dueDate < todayStr() && !isClosed;
  const displayStatus = isLate ? 'atrasada' : task.status;
  const statusLabel = { pendente:'Pendente', em_andamento:'Em andamento', concluida:'Concluída', cancelada:'Cancelada', atrasada:'Atrasada' };
  const frequencyLabel = { unica:'Única', diaria:'Diária', semanal:'Semanal' };

  const changeStatus = async (status) => {
    setBusy(true);
    try{ await onUpdate({ status, patientResponse:response, patientLinks:links }); }
    finally{ setBusy(false); }
  };

  const saveProgress = async () => {
    setBusy(true);
    try{
      await onUpdate({ patientResponse:response, patientLinks:links, skipStatusHistory:true });
      setSaved(true);
    } finally{ setBusy(false); }
  };

  return (
    <div className="task-card">
      <div className="tc-top">
        <div>
          <div className="tc-title">{task.title}</div>
        </div>
        <span className={'badge status-'+displayStatus}>{statusLabel[displayStatus] || displayStatus}</span>
      </div>
      <div className="tc-instructions">{task.instructions}</div>
      <div className="tc-meta-row">
        <span>Frequência: {frequencyLabel[task.frequency]}</span>
        {task.dueDate && <span>Prazo: {formatDateOnly(task.dueDate)}</span>}
      </div>
      {task.links && task.links.length > 0 && (
        <div className="tc-links">
          {task.links.map((l,i) => <a key={i} href={l} target="_blank" rel="noopener noreferrer">{l}</a>)}
        </div>
      )}

      {isClosed ? (
        <div className="field hint" style={{marginTop:10}}>Tarefa encerrada — não é mais possível alterar.</div>
      ) : (
        <React.Fragment>
          <div className="field" style={{marginTop:10}}>
            <label>Sua resposta ou comentário <span style={{fontWeight:400, color:'var(--ink-faint)'}}>(opcional)</span></label>
            <textarea value={response} onChange={e=>{ setResponse(e.target.value); setSaved(false); }} placeholder="Conte como foi..." />
          </div>
          <div className="field">
            <label>Seus links <span style={{fontWeight:400, color:'var(--ink-faint)'}}>(opcional)</span></label>
            <TagInput tags={links} onChange={(t)=>{ setLinks(t); setSaved(false); }} />
          </div>
          <div className="tc-actions" style={{alignItems:'center'}}>
            {!saved && (
              <button className="btn-link" onClick={saveProgress} disabled={busy}>Salvar resposta</button>
            )}
            {task.status === 'pendente' && (
              <button className="btn-link" onClick={()=>changeStatus('em_andamento')} disabled={busy}>Marcar como em andamento</button>
            )}
            {(task.status === 'pendente' || task.status === 'em_andamento') && (
              <button className="btn-link" style={{color:'var(--primary-dark)', fontWeight:700}} onClick={()=>changeStatus('concluida')} disabled={busy}>Marcar como concluída</button>
            )}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function MinhasTarefasPaciente({ user }){
  const [loading, setLoading] = useState(true);
  const [patientRecord, setPatientRecord] = useState(null);
  const [tasks, setTasks] = useState([]);

  const refresh = useCallback(async () => {
    const allPatients = await loadPatients();
    const record = allPatients.find(p => p.email.toLowerCase() === user.email.toLowerCase());
    setPatientRecord(record || null);
    if(record){
      const allTasks = await loadTasks();
      setTasks(
        allTasks.filter(t => t.patientId === record.id && t.status !== 'cancelada')
                .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))
      );
    }
    setLoading(false);
  }, [user.email]);

  useEffect(() => { refresh(); }, [refresh]);

  const updateTask = async (task, patch) => {
    const all = await loadTasks();
    const now = new Date().toISOString();
    const updated = all.map(t => {
      if(t.id !== task.id) return t;
      const next = { ...t, ...patch };
      delete next.skipStatusHistory;
      if(!patch.skipStatusHistory && patch.status && patch.status !== t.status){
        next.history = [...(t.history||[]), { status:patch.status, changedAt:now, by:'paciente' }];
      }
      return next;
    });
    await saveTasks(updated);
    if(patch.status && patch.status !== task.status){
      await pushNotification(task.psicologoId, {
        type:'tarefa',
        message:`${patientRecord.socialName||patientRecord.name} marcou "${task.title}" como ${patch.status==='concluida'?'concluída':'em andamento'}.`,
      });
    }
    await refresh();
  };

  if(loading) return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando…</div>;

  if(!patientRecord){
    return (
      <div className="empty-state">
        <div className="icon-wrap"><IconUserPlus size={24}/></div>
        <h2>Cadastro ainda não vinculado</h2>
        <p>Seu psicólogo ainda não te cadastrou no sistema com este e-mail ({user.email}).</p>
      </div>
    );
  }

  if(tasks.length === 0){
    return (
      <div className="empty-state">
        <div className="icon-wrap"><IconTask size={24}/></div>
        <h2>Nenhuma tarefa por enquanto</h2>
        <p>Quando seu psicólogo atribuir uma tarefa de casa, ela aparece aqui.</p>
      </div>
    );
  }

  return (
    <div>
      {tasks.map(t => <TaskCardPaciente key={t.id} task={t} onUpdate={(patch)=>updateTask(t, patch)} />)}
    </div>
  );
}

const toMinutes = (hhmm) => { const [h,m] = hhmm.split(':').map(Number); return h*60+m; };
const weekdayKeyOf = (dateStr) => WEEKDAYS[new Date(dateStr+'T00:00:00').getDay()].key;
const rangesOverlap = (aStart,aEnd,bStart,bEnd) => aStart < bEnd && bStart < aEnd;

function findBlockConflict(blocks, psicologoId, date, startTime, durationMin){
  const slotStart = toMinutes(startTime), slotEnd = slotStart + durationMin;
  return blocks.find(b => {
    if(b.psicologoId !== psicologoId) return false;
    if(b.type === 'horario_especifico'){
      if(b.date !== date) return false;
      return rangesOverlap(slotStart, slotEnd, toMinutes(b.startTime), toMinutes(b.endTime));
    }
    // feriado / ferias: bloqueio de dia inteiro dentro do intervalo
    return date >= b.startDate && date <= b.endDate;
  }) || null;
}
function findSessionConflict(sessions, psicologoId, date, startTime, durationMin, bufferMin, excludeId){
  const slotStart = toMinutes(startTime), slotEnd = slotStart + durationMin;
  return sessions.find(s => {
    if(s.psicologoId !== psicologoId || s.date !== date) return false;
    if(s.id === excludeId) return false;
    if(s.status === 'reagendada') return false; // reagendamentos sempre liberam o horário anterior
    if(s.status === 'cancelada' && !s.pendingRelease) return false; // cancelamento libera, salvo política de liberação manual
    const exStart = toMinutes(s.startTime) - bufferMin;
    const exEnd = toMinutes(s.startTime) + s.durationMin + bufferMin;
    return rangesOverlap(slotStart, slotEnd, exStart, exEnd);
  }) || null;
}
function isWithinWorkingHours(availability, date, startTime, durationMin){
  const day = availability.weeklyHours[weekdayKeyOf(date)];
  if(!day || !day.enabled) return false;
  const slotStart = toMinutes(startTime), slotEnd = slotStart + durationMin;
  return slotStart >= toMinutes(day.start) && slotEnd <= toMinutes(day.end);
}
function checkSlotAvailability({ availability, blocks, sessions, psicologoId, date, startTime, durationMin, excludeId }){
  if(!isWithinWorkingHours(availability, date, startTime, durationMin)){
    return { available:false, reason:'Fora do expediente configurado para este dia.' };
  }
  const block = findBlockConflict(blocks, psicologoId, date, startTime, durationMin);
  if(block){
    return { available:false, reason:`Horário bloqueado: ${block.label || (block.type==='feriado'?'feriado':'férias')}.` };
  }
  const conflict = findSessionConflict(sessions, psicologoId, date, startTime, durationMin, availability.bufferMin, excludeId);
  if(conflict){
    return { available:false, reason:`Conflito com outra sessão já confirmada às ${conflict.startTime} (considerando o intervalo de ${availability.bufferMin} min).` };
  }
  return { available:true, reason:null };
}
function isWithinAdvanceWindow(date, time, availability){
  const now = new Date();
  const slotDateTime = new Date(date+'T'+time+':00');
  const minAllowed = new Date(now.getTime() + availability.minAdvanceHours*3600*1000);
  const maxAllowed = new Date(now.getTime() + availability.maxAdvanceDays*24*3600*1000);
  return slotDateTime >= minAllowed && slotDateTime <= maxAllowed;
}
function listAvailableSlotsForDate(date, { availability, blocks, sessions, psicologoId }){
  const day = availability.weeklyHours[weekdayKeyOf(date)];
  if(!day || !day.enabled) return [];
  const dur = availability.defaultDurationMin;
  const out = [];
  for(let t = toMinutes(day.start); t + dur <= toMinutes(day.end); t += dur){
    const time = String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
    if(!isWithinAdvanceWindow(date, time, availability)) continue;
    const check = checkSlotAvailability({ availability, blocks, sessions, psicologoId, date, startTime:time, durationMin:dur });
    if(check.available) out.push(time);
  }
  return out;
}

function defaultCancelPolicy(){
  return { minHoursForFree:24, lateCancelCharge:'integral', lateCancelPercent:50, autoReleaseSlot:true };

function cancelPolicyText(policy){

    : policy.lateCancelCharge === 'parcial'
      ? `cobrança de ${policy.lateCancelPercent}% do valor da sessão`
      : 'nenhuma cobrança';
  return `Cancelamentos feitos com pelo menos ${policy.minHoursForFree}h de antecedência não geram cobrança. Cancelamentos fora desse prazo geram ${chargeText}. ${policy.autoReleaseSlot ? 'O horário é liberado automaticamente na agenda assim que o cancelamento é confirmado.' : 'O horário só é liberado na agenda após revisão do psicólogo.'}`;
}

function downloadTextFallbackReceipt(receipt){
  const lines = [
    'RECIBO DE PAGAMENTO',
    `Nº ${receipt.number}${receipt.status==='cancelado' ? ' — CANCELADO' : ''}`,
    '',
    `Profissional: ${receipt.professionalName}`,
    `Paciente: ${receipt.patientName}`,
    `Serviço: ${receipt.service}`,
    `Data do atendimento: ${formatDateOnly(receipt.date)}`,
    `Valor: ${formatCurrency(receipt.amount)}`,
    `Status: ${receipt.status === 'cancelado' ? 'Cancelado' : 'Pago'}`,
    receipt.supersedes ? `Substitui recibo: ${receipt.supersedes}` : '',
    '',
    `Emitido em ${formatDate(receipt.issuedAt)} — documento de demonstração gerado no MVP (TerapIA).`,
  ].filter(Boolean);
  const blob = new Blob([lines.join('\n')], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `recibo-${receipt.number}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function generateReceiptPDF(receipt){
  try{
    if(!window.jspdf || !window.jspdf.jsPDF){
      downloadTextFallbackReceipt(receipt); // PDF indisponível nesta sessão — entrega o recibo mesmo assim
      return true;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text('Recibo de Pagamento', 20, 22);
    doc.setFontSize(10);
    doc.setTextColor(120);
    doc.text(`Nº ${receipt.number}${receipt.status==='cancelado' ? '  —  CANCELADO' : ''}`, 20, 30);
    doc.setTextColor(20);
    doc.setFontSize(11);
    let y = 46;
    const line = (label, value) => { doc.text(`${label}: ${value}`, 20, y); y += 9; };
    line('Profissional', receipt.professionalName);
    line('Paciente', receipt.patientName);
    line('Serviço', receipt.service);
    line('Data do atendimento', formatDateOnly(receipt.date));
    line('Valor', formatCurrency(receipt.amount));
    line('Status', receipt.status === 'cancelado' ? 'Cancelado' : 'Pago');
    if(receipt.supersedes) line('Substitui recibo', receipt.supersedes);
    doc.setFontSize(8.5);
    doc.setTextColor(140);
    doc.text(`Emitido em ${formatDate(receipt.issuedAt)} — documento de demonstração gerado no MVP (TerapIA).`, 20, y + 8);

    // Download manual via Blob (mesmo mecanismo já comprovado na exportação de prontuário, US-010).
    // Evita o método .save() interno do jsPDF, que em alguns navegadores tenta abrir nova aba
    // e pode falhar dentro do iframe restrito do artefato.
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `recibo-${receipt.number}.pdf`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  }catch(e){
    try{ downloadTextFallbackReceipt(receipt); return true; }catch(e2){ return false; }
  }
}

/* ---------- Date helpers (US-005) ---------- */
const DOW_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function toDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fromDateStr(s){ return new Date(s+'T00:00:00'); }
function addDays(dateStr, n){ const d = fromDateStr(dateStr); d.setDate(d.getDate()+n); return toDateStr(d); }
function startOfWeek(dateStr){ const d = fromDateStr(dateStr); d.setDate(d.getDate()-d.getDay()); return toDateStr(d); }
function todayStr(){ return toDateStr(new Date()); }
function generateSlots(startH, endH, stepMin){
  const out = [];
  for(let m = startH*60; m < endH*60; m += stepMin){
    out.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
  }
  return out;
}
function computeSlotStatus(date, time, ctx){
  const { availability, blocks, sessions, psicologoId, stepMin } = ctx;
  const covering = sessions.find(s => {
    if(s.psicologoId !== psicologoId || s.date !== date) return false;
    const st = toMinutes(s.startTime), en = st + s.durationMin, t = toMinutes(time);
    return t >= st && t < en;
  });
  if(covering) return { kind:'sessao', session: covering };
  if(!isWithinWorkingHours(availability, date, time, stepMin)) return { kind:'fora' };
  const block = findBlockConflict(blocks, psicologoId, date, time, stepMin);
  if(block) return { kind:'bloqueado', label: block.label };
  return { kind:'livre' };
}

function RegisterScreen({ onRegister, goLogin }){

  const [showTerms, setShowTerms] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [pendingConfirmation, setPendingConfirmation] = useState(false);

  const submit = async (e) => {
    if(e && e.preventDefault) e.preventDefault();
    setError('');
    if(!name.trim()){ setError('Informe seu nome completo.'); return; }
    if(!EMAIL_RE.test(email)){ setError('Informe um e-mail válido.'); return; }
    if(password.length < 6){ setError('A senha precisa ter pelo menos 6 caracteres.'); return; }
    if(password !== confirm){ setError('As senhas não coincidem.'); return; }
    if(!acceptedTerms){ setError('É preciso aceitar os termos de uso e a política de privacidade para continuar.'); return; }
    setBusy(true);
    try{
      const { data, error: authError } = await supabase.auth.signUp({
        email, password,
        options: { data: { role, name: name.trim() } },
      });
      if(authError){
        setError(authError.message === 'User already registered' ? 'Já existe uma conta com este e-mail.' : authError.message);
        return;
      }
      if(data.session){
        // Confirmação de e-mail desativada no projeto — já temos sessão, registra o consentimento na hora.
        await supabase.from('profiles').update({
          terms_accepted_at: new Date().toISOString(), terms_version: TERMS_VERSION,

/* ---------- Patients list & management (US-003) ---------- */
function PacientesPsicologo({ psicologoId }){
  const [patients, setPatients] = useState(null); // null = carregando
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('ativo'); // ativo | arquivado | todos
  const [editing, setEditing] = useState(null); // patient object or 'new' or null
  const [linkedProfiles, setLinkedProfiles] = useState([]);

  const refresh = useCallback(async () => {
    const p = await loadPatients();
    const mine = p.filter(x => x.psicologoId === psicologoId);
    setPatients(mine);
    try{
      const emails = mine.map(x => x.email.toLowerCase());
      if(emails.length){
        const { data } = await supabase.from('profiles').select('email, terms_accepted_at, terms_version').eq('role','paciente').in('email', emails);
        setLinkedProfiles(data || []);
      } else {
        setLinkedProfiles([]);
      }
    }catch(e){ setLinkedProfiles([]); }
  }, [psicologoId]);

  useEffect(() => { refresh(); }, [refresh]);

  const consentFor = (patient) => {
    const linked = linkedProfiles.find(u => u.email.toLowerCase() === patient.email.toLowerCase());
    if(!linked) return null; // ainda não criou conta própria (ou ainda não migrado para o banco real)
    return !!(linked.terms_accepted_at && linked.terms_version === TERMS_VERSION);
  };

  const save = async (form) => {
    const all = await loadPatients();
    if(editing && editing !== 'new'){
      const updated = all.map(p => p.id === editing.id ? { ...p, ...form } : p);
      await savePatients(updated);
    } else {
      const newPatient = { id: patientId(), psicologoId, status:'ativo', createdAt:new Date().toISOString(), ...form };
      await savePatients([...all, newPatient]);
    }
    setEditing(null);
    await refresh();
  };

  const toggleStatus = async (patient) => {
    const all = await loadPatients();
    const updated = all.map(p => p.id === patient.id ? { ...p, status: p.status === 'ativo' ? 'arquivado' : 'ativo' } : p);
    await savePatients(updated);
    await refresh();
  };

  if(patients === null){
    return <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>Carregando pacientes…</div>;
  }

  const filtered = patients.filter(p => {
    if(statusFilter !== 'todos' && p.status !== statusFilter) return false;
    if(query.trim()){
      const q = query.toLowerCase();
      if(!p.name.toLowerCase().includes(q) && !p.email.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  return (
    <div>
      <div className="toolbar">
        <div style={{position:'relative', flex:1, minWidth:180}}>
          <IconSearch size={15} color="var(--ink-faint)" style={{position:'absolute', left:11, top:'50%', transform:'translateY(-50%)'}} />
          <input className="search-input" style={{paddingLeft:34}} placeholder="Buscar por nome ou e-mail"
                 value={query} onChange={e=>setQuery(e.target.value)} />
        </div>
        <div className="filter-pills">
          <button className={'filter-pill '+(statusFilter==='ativo'?'active':'')} onClick={()=>setStatusFilter('ativo')}>Ativos</button>
          <button className={'filter-pill '+(statusFilter==='arquivado'?'active':'')} onClick={()=>setStatusFilter('arquivado')}>Arquivados</button>
          <button className={'filter-pill '+(statusFilter==='todos'?'active':'')} onClick={()=>setStatusFilter('todos')}>Todos</button>
        </div>
        <button className="btn-new" onClick={()=>setEditing('new')}><IconPlus size={15}/> Novo paciente</button>
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">
          <div className="icon-wrap"><IconUserPlus size={24} /></div>
          <h2>{patients.length === 0 ? 'Nenhum paciente cadastrado' : 'Nada por aqui'}</h2>
          <p>{patients.length === 0
            ? 'Cadastre seu primeiro paciente para começar a organizar agenda, sessões e financeiro.'
            : 'Nenhum paciente corresponde à busca ou ao filtro selecionado.'}</p>
          {patients.length === 0 && (
            <button className="btn-primary" style={{marginTop:16, width:'auto', padding:'10px 20px'}} onClick={()=>setEditing('new')}>
              <IconPlus size={15}/> Cadastrar paciente
            </button>
          )}
        </div>
      ) : (
        <div className="patient-list">
          {filtered.map(p => {
            const consent = consentFor(p);
            const initials = p.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
            return (
              <div className="patient-row" key={p.id}>
                <div className="p-avatar">{initials}</div>
                <div className="p-main">
                  <div className="p-name">
                    {p.socialName || p.name}
                    <span className={'badge '+(p.status==='ativo'?'badge-ativo':'badge-arquivado')}>{p.status==='ativo'?'Ativo':'Arquivado'}</span>
                    {consent === true && <span className="badge badge-consent-ok">Consentimento OK</span>}
                    {consent === false && <span className="badge badge-consent-pending">Consentimento pendente</span>}
                    {consent === null && <span className="badge badge-consent-pending">Sem conta vinculada</span>}
                  </div>
                  <div className="p-sub">{p.email}{p.phone ? ' · '+p.phone : ''}{p.birthDate ? ' · nasc. '+formatDateOnly(p.birthDate) : ''}</div>
                </div>
                <div className="p-actions">
                  <button className="icon-btn" title="Editar" onClick={()=>setEditing(p)}><IconEdit size={15}/></button>
                  <button className="icon-btn" title={p.status==='ativo'?'Arquivar':'Reativar'} onClick={()=>toggleStatus(p)}><IconArchive size={15}/></button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {editing && (
        <PatientFormModal
          patient={editing === 'new' ? null : editing}
          onClose={()=>setEditing(null)}
          onSave={save}
        />
      )}
    </div>
  );
}

function BlocksPanel({ psicologoId, blocks, onAdd, onRemove }){
  const [type, setType] = useState('feriado');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [startTime, setStartTime] = useState('12:00');
  const [endTime, setEndTime] = useState('13:00');
  const [label, setLabel] = useState('');
  const [error, setError] = useState('');

  const add = () => {
    setError('');
    if(!startDate){ setError('Informe a data.'); return; }
    if(type === 'horario_especifico'){
      if(!startTime || !endTime || toMinutes(endTime) <= toMinutes(startTime)){ setError('Informe um intervalo de horário válido.'); return; }
      onAdd({ id:blockId(), psicologoId, type, date:startDate, startTime, endTime, label: label || 'Horário bloqueado' });
    } else {
      const end = endDate || startDate;
      if(end < startDate){ setError('A data final não pode ser antes da inicial.'); return; }
      onAdd({ id:blockId(), psicologoId, type, startDate, endDate:end, label: label || (type==='feriado' ? 'Feriado' : 'Férias') });
    }
    setStartDate(''); setEndDate(''); setLabel('');
  };

  return (
    <div className="panel">
      <h3>Bloqueios: férias, feriados e horários específicos</h3>
      <div className="panel-sub">Esses períodos nunca aparecem como disponíveis, mesmo dentro do seu expediente configurado.</div>

        <div className="field">
          <label>Tipo</label>
          <select value={type} onChange={e=>setType(e.target.value)}>
            <option value="feriado">Feriado</option>
            <option value="ferias">Férias</option>

        <div className="field">
          <label>{type==='horario_especifico' ? 'Data' : 'De'}</label>

        {type !== 'horario_especifico' ? (
          <div className="field">
            <label>Até</label>
            <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} />
          </div>
        ) : (
          <React.Fragment>
            <div className="field">
              <label>Início</label>
              <input type="time" value={startTime} onChange={e=>setStartTime(e.target.value)} />
            </div>
            <div className="field">
              <label>Fim</label>
              <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} />
            </div>
          </React.Fragment>
        )}
      </div>
      <div className="field">
        <label>Rótulo <span style={{fontWeight:400, color:'var(--ink-faint)'}}>(opcional)</span></label>
        <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Ex.: Recesso de fim de ano" />
      </div>
      <button className="btn-new" type="button" onClick={add}><IconPlus size={15}/> Adicionar bloqueio</button>

      <div style={{marginTop:18}}>
        {blocks.length === 0 ? (
          <div className="field hint">Nenhum bloqueio cadastrado ainda.</div>
        ) : blocks.map(b => (
          <div className="block-row" key={b.id}>
            <div className="b-info">

function TestSlotPanel({ psicologoId, availability, blocks, sessions, patients, onSessionCreated, onSessionRemoved }){
  const [date, setDate] = useState('');
  const [time, setTime] = useState('09:00');
  const [duration, setDuration] = useState(availability.defaultDurationMin);
  const [patientIdSel, setPatientIdSel] = useState(patients[0]?.id || '');
  const [result, setResult] = useState(null);

  const check = () => {
    if(!date){ setResult({ available:false, reason:'Escolha uma data.' }); return; }
    setResult(checkSlotAvailability({ availability, blocks, sessions, psicologoId, date, startTime:time, durationMin:Number(duration)||0 }));
  };

  const confirm = async () => {
    if(!patientIdSel){ setResult({ available:false, reason:'Cadastre um paciente antes de criar a sessão de teste (US-003).' }); return; }
    const newSession = {
      id: sessionId(), psicologoId, patientId: patientIdSel, date, startTime: time,
      durationMin: Number(duration)||0, status:'confirmada', valor: DEFAULT_SESSION_PRICE, createdAt: new Date().toISOString(),
    };
    await onSessionCreated(newSession);
    setResult({ available:false, reason:'Sessão de teste criada — o horário agora está ocupado. Tente verificar o mesmo horário de novo para ver o bloqueio.' });
  };

  const futureTestSessions = sessions
    .filter(s => s.psicologoId === psicologoId && s.status !== 'cancelada')
    .sort((a,b) => (a.date+a.startTime).localeCompare(b.date+b.startTime));

  return (
    <div className="panel">
      <h3>Verificar disponibilidade</h3>
      <div className="panel-sub">Use esta ferramenta para testar o motor de conflitos agora — a visualização completa em calendário chega em US-005.</div>
      <div className="inline-fields">
        <div className="field">
          <label>Data</label>
          <input type="date" value={date} onChange={e=>{setDate(e.target.value); setResult(null);}} />
        </div>
        <div className="field">
          <label>Horário</label>
          <input type="time" value={time} onChange={e=>{setTime(e.target.value); setResult(null);}} />
        </div>
        <div className="field">
          <label>Duração (min)</label>
          <input type="number" min="10" step="5" value={duration} onChange={e=>{setDuration(e.target.value); setResult(null);}} />
        </div>
        <div className="field">
          <label>Paciente (para criar a sessão de teste)</label>
          <select value={patientIdSel} onChange={e=>setPatientIdSel(e.target.value)}>
            <option value="">Selecione</option>
            {patients.map(p => <option key={p.id} value={p.id}>{p.socialName || p.name}</option>)}
          </select>
        </div>
      </div>
      <button className="btn-primary" type="button" style={{width:'auto', padding:'10px 20px'}} onClick={check}>Verificar disponibilidade</button>

      {result && (
        <div className={'test-result '+(result.available?'ok':'no')}>
          {result.available ? <IconCheckCircle size={17}/> : <IconXCircle size={17}/>}
          <div>
            <div>{result.available ? 'Horário disponível.' : result.reason}</div>
            {result.available && (
              <button className="btn-link" style={{marginTop:6}} onClick={confirm}>Confirmar sessão de teste neste horário</button>
            )}
          </div>
        </div>
      )}

      {futureTestSessions.length > 0 && (
        <div style={{marginTop:18}}>
          <div className="field hint" style={{marginBottom:6}}>Sessões já confirmadas (ocupam a agenda):</div>
          {futureTestSessions.map(s => {
            const p = patients.find(pp => pp.id === s.patientId);
            return (
              <div className="mini-session-row" key={s.id}>
                <span>{formatDateOnly(s.date)} às {s.startTime} · {p ? (p.socialName||p.name) : 'Paciente removido'} · {s.durationMin} min</span>
                <button className="icon-btn" title="Cancelar sessão de teste" onClick={()=>onSessionRemoved(s.id)}><IconTrash size={14}/></button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
